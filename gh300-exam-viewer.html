<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GH-300: GitHub Copilot Certification — Practice Exam</title>
<style>
  :root{
    --navy:#1a1a2e; --navy2:#16213e; --accent:#3b82f6; --accent2:#2563eb;
    --green:#16a34a; --green-bg:#dcfce7; --red:#dc2626; --red-bg:#fee2e2;
    --orange:#ea580c; --gray:#e5e7eb; --ink:#1f2933; --muted:#64748b;
    --card:#ffffff; --bg:#eef1f6;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5;}
  a{color:var(--accent2);}
  /* Exam bar */
  .exam-bar{position:sticky;top:0;z-index:50;background:var(--navy);color:#fff;
    display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 16px;
    box-shadow:0 2px 8px rgba(0,0,0,.25);}
  .exam-bar .title{font-weight:700;font-size:1rem;margin-right:auto;}
  .exam-bar .qpos{font-weight:600;font-size:.9rem;opacity:.95;}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;background:rgba(255,255,255,.12);
    padding:6px 10px;border-radius:8px;font-size:.95rem;}
  .timer.warn{background:var(--red);}
  select#testSel{background:var(--navy2);color:#fff;border:1px solid #33415e;
    border-radius:8px;padding:6px 8px;font-size:.85rem;}
  .wrap{max-width:1024px;margin:0 auto;padding:16px;display:grid;
    grid-template-columns:220px 1fr;gap:16px;}
  /* Palette */
  .palette{background:var(--card);border-radius:12px;padding:12px;
    box-shadow:0 1px 4px rgba(0,0,0,.08);align-self:start;position:sticky;top:64px;}
  .palette h3{margin:0 0 8px;font-size:.8rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);}
  .palette .legend{font-size:.7rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;}
  .legend span{display:inline-flex;align-items:center;gap:4px;}
  .dot{width:10px;height:10px;border-radius:3px;display:inline-block;}
  .dot.u{background:var(--gray);} .dot.a{background:var(--accent);} .dot.f{background:var(--orange);}
  .pgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;}
  .pgrid button{border:1px solid #d1d5db;background:var(--gray);color:var(--ink);
    border-radius:6px;padding:7px 0;font-size:.78rem;cursor:pointer;font-weight:600;}
  .pgrid button.answered{background:var(--accent);color:#fff;border-color:var(--accent2);}
  .pgrid button.flagged{background:var(--orange);color:#fff;border-color:var(--orange);}
  .pgrid button.current{outline:3px solid var(--navy);outline-offset:1px;}
  .palette .ptoggle{display:none;}
  /* Card */
  .panel{min-width:0;}
  .card{background:var(--card);border-radius:12px;padding:20px;
    box-shadow:0 1px 6px rgba(0,0,0,.08);display:none;}
  .card.active{display:block;}
  .qmeta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px;}
  .badge{font-size:.7rem;font-weight:700;padding:3px 8px;border-radius:999px;
    background:#eef2ff;color:#4338ca;text-transform:uppercase;letter-spacing:.03em;}
  .badge.type{background:#f1f5f9;color:#475569;}
  .chip{font-size:.72rem;font-weight:700;padding:3px 9px;border-radius:999px;margin-left:auto;}
  .chip.High{background:var(--green-bg);color:var(--green);}
  .chip.Medium{background:#fef9c3;color:#a16207;}
  .chip.Low{background:var(--red-bg);color:var(--red);}
  .flagbtn{font-size:.74rem;border:1px solid #fdba74;background:#fff7ed;color:var(--orange);
    padding:4px 10px;border-radius:999px;cursor:pointer;font-weight:600;}
  .flagbtn.on{background:var(--orange);color:#fff;}
  .stem{font-size:1.02rem;font-weight:600;margin:6px 0 14px;}
  .hint{font-size:.78rem;color:var(--muted);margin-bottom:10px;}
  .opt{display:flex;gap:10px;align-items:flex-start;border:1.5px solid #e2e8f0;
    border-radius:10px;padding:10px 12px;margin-bottom:8px;cursor:pointer;background:#fff;}
  .opt:hover{border-color:#c7d2fe;}
  .opt.sel{border-color:var(--accent);background:#eff6ff;}
  .opt .mark{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid #cbd5e1;
    display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:700;color:var(--muted);}
  .opt.multi .mark{border-radius:6px;}
  .opt.sel .mark{border-color:var(--accent);background:var(--accent);color:#fff;}
  .opt .ltr{font-weight:700;margin-right:4px;}
  .opt.correct{border-color:var(--green);background:var(--green-bg);}
  .opt.wrong{border-color:var(--red);background:var(--red-bg);}
  .hotrow{display:flex;gap:10px;align-items:center;margin-bottom:8px;flex-wrap:wrap;}
  .hotrow label{font-weight:600;min-width:160px;}
  .hotrow select{padding:7px 8px;border-radius:8px;border:1.5px solid #cbd5e1;font-size:.9rem;}
  .hotrow.correct select{border-color:var(--green);background:var(--green-bg);}
  .hotrow.wrong select{border-color:var(--red);background:var(--red-bg);}
  .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;align-items:center;}
  .btn{border:none;border-radius:9px;padding:9px 16px;font-size:.9rem;font-weight:600;cursor:pointer;}
  .btn.primary{background:var(--accent2);color:#fff;}
  .btn.ghost{background:#f1f5f9;color:var(--ink);}
  .btn.dark{background:var(--navy);color:#fff;}
  .btn:disabled{opacity:.45;cursor:not-allowed;}
  .jump{display:flex;align-items:center;gap:6px;margin-left:auto;font-size:.82rem;color:var(--muted);}
  .jump input{width:58px;padding:6px;border-radius:7px;border:1px solid #cbd5e1;font-size:.85rem;}
  .feedback{margin-top:14px;border-radius:10px;padding:12px 14px;font-size:.9rem;display:none;}
  .feedback.show{display:block;}
  .feedback.ok{background:var(--green-bg);border:1px solid var(--green);}
  .feedback.no{background:var(--red-bg);border:1px solid var(--red);}
  .feedback h4{margin:0 0 6px;font-size:.95rem;}
  .feedback ul{margin:8px 0 0;padding-left:18px;}
  .refs{margin-top:10px;font-size:.78rem;}
  .refs a{display:block;margin-bottom:2px;word-break:break-all;}
  /* Modal */
  .modal{position:fixed;inset:0;background:rgba(15,23,42,.55);display:none;
    align-items:flex-start;justify-content:center;padding:24px 12px;z-index:100;overflow:auto;}
  .modal.show{display:flex;}
  .modal-card{background:#fff;border-radius:14px;max-width:680px;width:100%;padding:22px;}
  .modal-card h2{margin:0 0 4px;}
  .score{font-size:2rem;font-weight:800;}
  .score small{font-size:1rem;color:var(--muted);font-weight:600;}
  table.brk{width:100%;border-collapse:collapse;margin:14px 0;font-size:.85rem;}
  table.brk th,table.brk td{border-bottom:1px solid #e5e7eb;padding:7px 8px;text-align:left;}
  table.brk th{color:var(--muted);font-weight:700;font-size:.75rem;text-transform:uppercase;}
  .rev-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;}
  .rev-list button{border:1px solid #cbd5e1;background:#f8fafc;border-radius:6px;padding:5px 9px;
    cursor:pointer;font-size:.8rem;font-weight:600;}
  .rev-list button.flag{border-color:var(--orange);color:var(--orange);}
  .rev-list button.wrongq{border-color:var(--red);color:var(--red);}
  @media (max-width:760px){
    .wrap{grid-template-columns:1fr;}
    .palette{position:static;}
    .palette .ptoggle{display:block;width:100%;border:none;background:#f1f5f9;border-radius:8px;
      padding:8px;font-weight:700;cursor:pointer;margin-bottom:8px;}
    .palette .pbody.collapsed{display:none;}
    .jump{margin-left:0;width:100%;}
    .exam-bar .title{font-size:.85rem;width:100%;}
  }
</style>
</head>

  <div class="qpos" id="qpos">Question 1 of 50</div>
  <select id="testSel" title="Select test"></select>
  <div class="timer" id="timer">100:00</div>
  <button class="btn dark" id="endBtn" style="padding:6px 12px;font-size:.82rem;">End / Review</button>
</div>

<div class="wrap">

    <button class="ptoggle" id="ptoggle">Question Navigator ▾</button>

<script>
const DATA = {"title": "GH-300: GitHub Copilot Certification", "slug": "gh300", "tests": [{"number": 1, "questions": [{"id": 1, "objective": "Domain 1: Use GitHub Copilot responsibly", "type": "mc", "stem": "A developer notices that GitHub Copilot confidently suggested a function that calls a library method which does not actually exist. What is the most accurate term for this behavior?", "confidence": 90, "confidence_label": "High", "references": ["https://docs.github.com/en/copilot/responsible-use-of-github-copilot-features", "https://resources.github.com/learn/pathways/copilot/essentials/establishing-trust-in-using-github-copilot/"], "options": {"A": "A hallucination, where the model generates plausible-looking but factually incorrect output", "B": "A telemetry error in the IDE extension", "C": "A regression introduced by a recent model update", "D": "A content exclusion that hid the real method name"}, "answer": "A", "explanation": "<p><strong>Correct answer: A</strong></p><p>Generative models can produce fluent, confident output that is nonetheless wrong or invented; calling a non-existent API is a classic hallucination, so suggestions must always be reviewed.</p><ul><li><strong>B</strong> — Telemetry concerns usage data collection and has nothing to do with the correctness of a suggestion.</li><li><strong>C</strong> — Model updates can change behavior but inventing a non-existent API is specifically a hallucination, not a regression.</li><li><strong>D</strong> — Content exclusions block files from being used as context; they do not invent fake method names.</li></ul>"}, {"id": 2, "objective": "Domain 1: Use GitHub Copilot responsibly", "type": "mc", "stem": "Which practice best reflects responsible use of GitHub Copilot when accepting generated code?", "confidence": 92, "confidence_label": "High", "references": ["https://docs.github.com/en/copilot/responsible-use-of-github-copilot-features", "https://learn.microsoft.com/en-us/training/courses/gh-300"], "options": {"A": "Always review, test, and validate suggestions before merging, treating Copilot as an assistant rather than an authority", "B": "Disable code review for files where Copilot was used to save time", "C": "Assume suggestions are secure because they were generated by an AI trained on public code", "D": "Accept all suggestions automatically to maximize productivity gains"}, "answer": "A", "explanation": "<p><strong>Correct answer: A</strong></p><p>Copilot is a probabilistic assistant; the developer remains accountable for the code, so every suggestion should be reviewed, tested, and validated before it ships.</p><ul><li><strong>B</strong> — Skipping review for AI-assisted code removes the most important safeguard against defects.</li><li><strong>C</strong> — Training on public code does not guarantee security; suggestions can contain insecure patterns.</li><li><strong>D</strong> — Blindly accepting suggestions abandons human accountability and can introduce bugs or vulnerabilities.</li></ul>"}, {"id": 3, "objective": "Domain 1: Use GitHub Copilot responsibly", "type": "mc", "stem": "Why should developers be cautious about potential bias in code or comments suggested by GitHub Copilot?", "confidence": 86, "confidence_label": "High", "references": ["https://docs.github.com/en/copilot/responsible-use-of-github-copilot-features", "https://resources.github.com/learn/pathways/copilot/essentials/establishing-trust-in-using-github-copilot/"], "options": {"A": "Because bias only affects natural-language chat and never code completions", "B": "Because Copilot intentionally inserts biased content to test the developer", "C": "Because the model learned from large public datasets that may contain biased language or assumptions that can surface in suggestions", "D": "Because bias is fully removed by the IDE extension before display"}, "answer": "C", "explanation": "<p><strong>Correct answer: C</strong></p><p>Models trained on large public corpora can reproduce societal or historical biases present in that data, so human judgment is needed to catch biased wording or assumptions.</p><ul><li><strong>A</strong> — Bias can appear in identifiers, comments, and completions, not only in chat.</li><li><strong>B</strong> — Copilot does not deliberately insert biased content; bias is an emergent property of training data.</li><li><strong>D</strong> — The IDE extension renders suggestions; it does not guarantee removal of all bias.</li></ul>"}, {"id": 4, "objective": "Domain 1: Use GitHub Copilot responsibly", "type": "mc", "stem": "A team wants to ensure that code suggested by Copilot does not violate open-source licenses. Which built-in feature most directly helps with this concern?", "confidence": 85, "confidence_label": "High", "references": ["https://docs.github.com/en/copilot/responsible-use-of-github-copilot-features", "https://docs.github.com/en/copilot/managing-copilot/managing-github-copilot-in-your-organization/setting-policies-for-copilot-in-your-organization/managing-policies-for-copilot-in-your-organization"], "options": {"A": "The @workspace chat participant", "B": "The duplicate detection / code referencing filter that can block suggestions matching public code", "C": "The countdown timer in the IDE that limits suggestion frequency", "D": "The Copilot CLI 'gh copilot explain' command"}, "answer": "B", "explanation": "<p><strong>Correct answer: B</strong></p><p>GitHub Copilot's duplication detection filter can block suggestions that match public code, and code referencing surfaces matches with their licenses, directly addressing licensing concerns.</p><ul><li><strong>A</strong> — @workspace adds repository context to chat but does not address license matching.</li><li><strong>C</strong> — There is no suggestion-frequency timer; this does not exist as a licensing safeguard.</li><li><strong>D</strong> — 'gh copilot explain' clarifies commands; it has no role in license filtering.</li></ul>"}, {"id": 5, "objective": "Domain 1: Use GitHub Copilot responsibly", "type": "mc", "stem": "Who is ultimately accountable for code that is committed to a repository after being generated with GitHub Copilot?", "confidence": 91, "confidence_label": "High", "references": ["https://docs.github.com/en/copilot/responsible-use-of-github-copilot-features", "https://learn.microsoft.com/en-us/training/courses/gh-300"], "options": {"A": "No one, because AI-generated code is exempt from ownership", "B": "The developer who reviews, accepts, and commits the code", "C": "The model provider, because it trained the underlying model", "D": "GitHub, because it operates the Copilot service"}, "answer": "B", "explanation": "<p><strong>Correct answer: B</strong></p><p>Copilot is an assistant; the human developer who accepts and commits the code is responsible for its correctness, security, and licensing.</p><ul><li><strong>A</strong> — All committed code has an accountable author regardless of how it was produced.</li><li><strong>C</strong> — The model provider trains the model but is not accountable for individual commits.</li><li><strong>D</strong> — GitHub provides the tool but does not assume responsibility for what developers ship.</li></ul>"}, {"id": 6, "objective": "Domain 1: Use GitHub Copilot responsibly", "type": "mc", "stem": "What is a responsible way to handle a Copilot suggestion that appears to contain a hard-coded secret or credential?", "confidence": 88, "confidence_label": "High", "references": ["https://docs.github.com/en/copilot/responsible-use-of-github-copilot-features", "https://docs.github.com/en/copilot/managing-copilot/managing-github-copilot-in-your-organization/setting-policies-for-copilot-in-your-organization/managing-policies-for-copilot-in-your-organization"], "options": {"A": "Accept it because Copilot would not suggest a real secret", "B": "Reject the suggestion and never commit secrets; use a secret manager or environment variables instead", "C": "Commit it to a private repository where secret scanning does not run", "D": "Accept it and rely on secret scanning to remove it later"}, "answer": "B", "explanation": "<p><strong>Correct answer: B</strong></p><p>Hard-coded credentials are a security risk regardless of source; the responsible action is to reject them and use proper secret management.</p><ul><li><strong>A</strong> — Copilot can suggest secret-like patterns; trusting it blindly is unsafe.</li><li><strong>C</strong> — Private repositories still should not contain hard-coded secrets, and scanning may still apply.</li><li><strong>D</strong> — Relying on after-the-fact scanning still risks exposure and is not a substitute for not committing secrets.</li></ul>"}, {"id": 7, "objective": "Domain 1: Use GitHub Copilot responsibly", "type": "mc", "stem": "Which statement best describes the relationship between GitHub Copilot suggestions and the developer's professional judgment?", "confidence": 87, "confidence_label": "High", "references": ["https://docs.github.com/en/copilot/responsible-use-of-github-copilot-features", "https://learn.microsoft.com/en-us/training/courses/gh-300"], "options": {"A": "Suggestions are guaranteed correct for well-known algorithms", "B": "Suggestions should be trusted more when the confidence appears high in the editor", "C": "Suggestions replace the need for code review on small changes", "D": "Suggestions are a starting point that must be evaluated with domain knowledge and critical thinking"}, "answer": "D", "explanation": "<p><strong>Correct answer: D</strong></p><p>Copilot augments developers; their professional judgment is essential to evaluate correctness, security, and fit for purpose.</p><ul><li><strong>A</strong> — Even well-known algorithms can be implemented incorrectly by the model.</li><li><strong>B</strong> — The editor does not expose a reliable correctness 'confidence' for suggestions.</li><li><strong>C</strong> — Even small changes deserve review; AI assistance does not remove that need.</li></ul>"}, {"id": 8, "objective": "Domain 1: Use GitHub Copilot responsibly", "type": "mc", "stem": "A company is drafting an internal policy for responsible AI tool use. Which element is MOST important to include for GitHub Copilot?", "confidence": 89, "confidence_label": "High", "references": ["https://docs.github.com/en/copilot/responsible-use-of-github-copilot-features", "https://learn.microsoft.com/en-us/training/courses/gh-300"], "options": {"A": "Guidance that all AI-assisted code must still pass the organization's review, testing, and security gates", "B": "A rule that Copilot must write at least 50% of all new code", "C": "A mandate to accept suggestions without modification to preserve model intent", "D": "A requirement to disable all human code review when Copilot is enabled"}, "answer": "A", "explanation": "<p><strong>Correct answer: A</strong></p><p>Responsible-use policies focus on keeping human oversight: review, testing, and security checks must still apply to AI-assisted code.</p><ul><li><strong>B</strong> — Mandating a code-volume quota encourages misuse and ignores quality.</li><li><strong>C</strong> — Forcing unmodified acceptance prevents developers from correcting flawed suggestions.</li><li><strong>D</strong> — Disabling human review removes the key safeguard and is irresponsible.</li></ul>"}, {"id": 9, "objective": "Domain 1: Use GitHub Copilot responsibly", "type": "mc", "stem": "Why might a Copilot suggestion be inappropriate even if it compiles and passes a quick smoke test?", "confidence": 88, "confidence_label": "High", "references": ["https://docs.github.com/en/copilot/responsible-use-of-github-copilot-features"], "options": {"A": "It may contain subtle security flaws, licensing issues, or logic that does not match the actual requirements", "B": "Compiled code is always free of security and licensing concerns", "C": "Passing a smoke test guarantees the code meets all requirements", "D": "Copilot only suggests code that has been formally verified"}, "answer": "A", "explanation": "<p><strong>Correct answer: A</strong></p><p>Compiling and passing a smoke test does not guarantee security, correct licensing, or that the logic truly fits the requirement; deeper review is still needed.</p><ul><li><strong>B</strong> — Compilation says nothing about security or licensing.</li><li><strong>C</strong> — A smoke test covers only basic behavior, not all requirements or edge cases.</li><li><strong>D</strong> — Copilot suggestions are not formally verified.</li></ul>"}, {"id": 10, "objective": "Domain 1: Use GitHub Copilot responsibly", "type": "mc", "stem": "What does it mean to keep a 'human in the loop' when using GitHub Copilot?", "confidence": 87, "confidence_label": "High", "references": ["https://docs.github.com/en/copilot/responsible-use-of-github-copilot-features", "https://learn.microsoft.com/en-us/training/courses/gh-300"], "options": {"A": "A human manually retrains the model after each session", "B": "GitHub staff review every suggestion before it reaches the developer", "C": "Copilot waits for a human to type before generating any suggestion", "D": "A person reviews, validates, and decides whether to accept AI-generated output before it is used"}, "answer": "D", "explanation": "<p><strong>Correct answer: D</strong></p><p>'Human in the loop' means a developer evaluates and approves AI output, retaining responsibility and control over what is used.</p><ul><li><strong>A</strong> — Developers do not retrain the model; that is not how Copilot works.</li><li><strong>B</strong> — GitHub staff do not review individual suggestions in real time.</li><li><strong>C</strong> — Triggering on typing is a UI behavior, not the governance concept of human oversight.</li></ul>"}, {"id": 11, "objective": "Domain 1: Use GitHub Copilot responsibly", "type": "mc", "stem": "A junior developer relies entirely on Copilot to learn a new framework without reading documentation. What is the primary risk?", "confidence": 86, "confidence_label": "High", "references": ["https://docs.github.com/en/copilot/responsible-use-of-github-copilot-features", "https://learn.microsoft.com/en-us/training/courses/gh-300"], "options": {"A": "They may internalize incorrect or outdated patterns and lack the understanding to spot errors", "B": "The IDE will throttle suggestions to force documentation reading", "C": "There is no risk because Copilot always reflects current best practices", "D": "Copilot will refuse to generate code for new frameworks"}, "answer": "A", "explanation": "<p><strong>Correct answer: A</strong></p><p>Over-reliance without foundational understanding can lead to learning wrong patterns and an inability to evaluate suggestions critically.</p><ul><li><strong>B</strong> — No throttling mechanism forces documentation reading.</li><li><strong>C</strong> — Copilot can reflect outdated or non-idiomatic patterns from training data.</li><li><strong>D</strong> — Copilot will still attempt suggestions for new frameworks.</li></ul>"}, {"id": 12, "objective": "Domain 1: Use GitHub Copilot responsibly", "type": "mc", "stem": "Which approach helps mitigate the risk of GitHub Copilot suggesting insecure code?", "confidence": 88, "confidence_label": "High", "references": ["https://docs.github.com/en/copilot/responsible-use-of-github-copilot-features", "https://docs.github.com/en/copilot/managing-copilot/managing-github-copilot-in-your-organization/setting-policies-for-copilot-in-your-organization/managing-policies-for-copilot-in-your-organization"], "options": {"A": "Combine Copilot with static analysis, dependency scanning, and security-focused code review", "B": "Increase the editor font size to read suggestions more carefully", "C": "Only use Copilot for production code, never for tests", "D": "Trust Copilot output and remove existing security tooling"}, "answer": "A", "explanation": "<p><strong>Correct answer: A</strong></p><p>Layering Copilot with established security tooling (SAST, dependency scanning) and review reduces the chance insecure suggestions reach production.</p><ul><li><strong>B</strong> — Font size has no bearing on the security of suggestions.</li><li><strong>C</strong> — Restricting Copilot to production code does not address security at all.</li><li><strong>D</strong> — Removing security tooling increases risk rather than mitigating it.</li></ul>"}, {"id": 13, "objective": "Domain 1: Use GitHub Copilot responsibly", "type": "mc", "stem": "Why is transparency about AI assistance sometimes important on a development team?", "confidence": 80, "confidence_label": "Medium", "references": ["https://docs.github.com/en/copilot/responsible-use-of-github-copilot-features"], "options": {"A": "It helps reviewers apply appropriate scrutiny and supports trust, auditing, and compliance", "B": "It lets GitHub identify which developers to remove from Copilot", "C": "It is required to prevent the model from learning new patterns", "D": "It allows the team to bill customers extra for AI usage"}, "answer": "A", "explanation": "<p><strong>Correct answer: A</strong></p><p>Knowing where AI assistance was used helps reviewers calibrate scrutiny and supports auditability and compliance obligations.</p><ul><li><strong>B</strong> — Disclosure is not used by GitHub to remove developers.</li><li><strong>C</strong> — Transparency does not control model training behavior.</li><li><strong>D</strong> — Transparency is about trust and review, not billing customers more.</li></ul>"}, {"id": 14, "objective": "Domain 1: Use GitHub Copilot responsibly", "type": "mc", "stem": "A developer wants to ensure accessibility and inclusive language in generated comments. What is the responsible step?", "confidence": 82, "confidence_label": "Medium", "references": ["https://docs.github.com/en/copilot/responsible-use-of-github-copilot-features"], "options": {"A": "Assume generated comments are already fully inclusive", "B": "Manually review and revise generated text to meet accessibility and inclusivity standards", "C": "Disable comments entirely to avoid the issue", "D": "Rely on the model temperature setting to enforce inclusivity"}, "answer": "B", "explanation": "<p><strong>Correct answer: B</strong></p><p>The model may not always produce inclusive language, so human review and revision of generated text is the responsible step.</p><ul><li><strong>A</strong> — Generated comments are not guaranteed inclusive and need review.</li><li><strong>C</strong> — Removing comments harms maintainability and does not address the underlying concern.</li><li><strong>D</strong> — There is no user-facing temperature control that enforces inclusivity.</li></ul>"}, {"id": 15, "objective": "Domain 1: Use GitHub Copilot responsibly", "type": "mc", "stem": "What is the best response when Copilot generates code that closely resembles a known copyrighted snippet?", "confidence": 84, "confidence_label": "Medium", "references": ["https://docs.github.com/en/copilot/responsible-use-of-github-copilot-features", "https://docs.github.com/en/copilot/managing-copilot/managing-github-copilot-in-your-organization/setting-policies-for-copilot-in-your-organization/managing-policies-for-copilot-in-your-organization"], "options": {"A": "Rename the variables so the match is no longer detectable", "B": "Use code referencing to check for matches and avoid using the snippet unless licensing is compatible", "C": "Commit it and wait for a takedown notice before acting", "D": "Use it anyway because AI output cannot be copyrighted"}, "answer": "B", "explanation": "<p><strong>Correct answer: B</strong></p><p>Code referencing surfaces public matches and their licenses so developers can avoid incompatible code; ignoring or obfuscating matches is irresponsible.</p><ul><li><strong>A</strong> — Renaming to evade detection does not change the licensing reality and is unethical.</li><li><strong>C</strong> — Waiting for a takedown is a reactive, risky, and irresponsible approach.</li><li><strong>D</strong> — The fact that output came from AI does not resolve underlying licensing of matched code.</li></ul>"}, {"id": 16, "objective": "Domain 1: Use GitHub Copilot responsibly", "type": "mc", "stem": "Which scenario is the clearest example of over-reliance on GitHub Copilot?", "confidence": 89, "confidence_label": "High", "references": ["https://docs.github.com/en/copilot/responsible-use-of-github-copilot-features"], "options": {"A": "Merging generated code to production without understanding what it does", "B": "Asking Copilot to explain an unfamiliar code block before editing it", "C": "Using Copilot to draft a first version, then refactoring and testing it", "D": "Declining a suggestion that does not fit the architecture"}, "answer": "A", "explanation": "<p><strong>Correct answer: A</strong></p><p>Shipping code you do not understand removes human judgment and is the textbook over-reliance failure mode.</p><ul><li><strong>B</strong> — Using Copilot to explain code increases understanding rather than reducing it.</li><li><strong>C</strong> — Drafting then refactoring and testing is healthy, responsible use.</li><li><strong>D</strong> — Declining a poor suggestion demonstrates good judgment, not over-reliance.</li></ul>"}, {"id": 17, "objective": "Domain 1: Use GitHub Copilot responsibly", "type": "mc", "stem": "How should a developer treat factual claims (e.g., about an API or standard) that Copilot Chat states in its answer?", "confidence": 87, "confidence_label": "High", "references": ["https://docs.github.com/en/copilot/using-github-copilot/copilot-chat", "https://docs.github.com/en/copilot/responsible-use-of-github-copilot-features"], "options": {"A": "Treat them as legally binding guidance", "B": "Verify them against authoritative documentation before relying on them", "C": "Accept them as authoritative because Chat cites the official model", "D": "Assume they are current because the model is updated daily"}, "answer": "B", "explanation": "<p><strong>Correct answer: B</strong></p><p>Chat can state incorrect or outdated facts; verifying against authoritative docs is the responsible practice.</p><ul><li><strong>A</strong> — Chat answers are not legal guidance.</li><li><strong>C</strong> — Chat is not an authoritative source and may be wrong.</li><li><strong>D</strong> — Model knowledge has a training cutoff and is not updated daily for every fact.</li></ul>"}, {"id": 18, "objective": "Domain 1: Use GitHub Copilot responsibly", "type": "mc", "stem": "Why is it important to evaluate Copilot suggestions for edge cases and error handling?", "confidence": 86, "confidence_label": "High", "references": ["https://docs.github.com/en/copilot/responsible-use-of-github-copilot-features"], "options": {"A": "Copilot always adds comprehensive error handling automatically", "B": "Edge cases are handled by the IDE, not the code", "C": "Error handling is unnecessary in modern languages", "D": "Generated code often focuses on the happy path and may omit validation or error handling"}, "answer": "D", "explanation": "<p><strong>Correct answer: D</strong></p><p>Suggestions frequently implement only the common case, so developers must add or verify validation and error handling.</p><ul><li><strong>A</strong> — Copilot does not guarantee comprehensive error handling.</li><li><strong>B</strong> — The IDE does not implement runtime error handling for your program.</li><li><strong>C</strong> — Robust error handling remains necessary in every language.</li></ul>"}, {"id": 19, "objective": "Domain 1: Use GitHub Copilot responsibly", "type": "mc", "stem": "A regulated industry team must document AI use for audits. Which Copilot-related practice best supports this?", "confidence": 81, "confidence_label": "Medium", "references": ["https://docs.github.com/en/copilot/responsible-use-of-github-copilot-features", "https://docs.github.com/en/copilot/managing-copilot/managing-github-copilot-in-your-organization/setting-policies-for-copilot-in-your-organization/managing-policies-for-copilot-in-your-organization"], "options": {"A": "Turning off all logging so no audit trail exists", "B": "Maintaining records of policies, enabled features, and review processes for AI-assisted code", "C": "Relying solely on the model provider to keep audit records", "D": "Letting each developer choose undocumented personal settings"}, "answer": "B", "explanation": "<p><strong>Correct answer: B</strong></p><p>Audit readiness comes from documenting policies, configurations, and review processes for AI-assisted work.</p><ul><li><strong>A</strong> — Disabling logging undermines auditability.</li><li><strong>C</strong> — Organizations cannot outsource their own audit obligations to the provider.</li><li><strong>D</strong> — Undocumented per-developer settings make audits impossible.</li></ul>"}, {"id": 20, "objective": "Domain 1: Use GitHub Copilot responsibly", "type": "mc", "stem": "What is a balanced view of Copilot's impact on developer skill growth?", "confidence": 83, "confidence_label": "Medium", "references": ["https://docs.github.com/en/copilot/responsible-use-of-github-copilot-features", "https://learn.microsoft.com/en-us/training/courses/gh-300"], "options": {"A": "It has no effect on skills in any scenario", "B": "It always improves skills because developers see more code", "C": "It always harms skills because developers stop thinking", "D": "It can accelerate learning when used to explore and explain, but unchecked reliance can hinder deep understanding"}, "answer": "D", "explanation": "<p><strong>Correct answer: D</strong></p><p>Copilot can support learning when used thoughtfully, but uncritical reliance can impede the development of deep understanding.</p><ul><li><strong>A</strong> — It clearly can influence skill development positively or negatively.</li><li><strong>B</strong> — Merely seeing more code does not guarantee skill growth without engagement.</li><li><strong>C</strong> — Used well, Copilot can aid learning; the harm comes from misuse, not the tool itself.</li></ul>"}, {"id": 21, "objective": "Domain 1: Use GitHub Copilot responsibly", "type": "mc", "stem": "Which is the most responsible reaction to a Copilot suggestion you do not fully understand?", "confidence": 87, "confidence_label": "High", "references": ["https://docs.github.com/en/copilot/using-github-copilot/copilot-chat", "https://docs.github.com/en/copilot/responsible-use-of-github-copilot-features"], "options": {"A": "Delete the file to avoid the confusion", "B": "Accept it because it appeared first and is likely the best", "C": "Ask Copilot Chat to explain it and consult documentation before deciding to use it", "D": "Reformat the code until it looks familiar, then commit"}, "answer": "C", "explanation": "<p><strong>Correct answer: C</strong></p><p>Seeking an explanation and verifying with documentation builds understanding so you can make an informed accept/reject decision.</p><ul><li><strong>A</strong> — Deleting the file avoids learning and may lose needed work.</li><li><strong>B</strong> — Ordering of suggestions does not indicate correctness or quality.</li><li><strong>D</strong> — Reformatting does not create understanding of the logic.</li></ul>"}, {"id": 22, "objective": "Domain 1: Use GitHub Copilot responsibly", "type": "mc", "stem": "What does responsible use imply about testing AI-generated code?", "confidence": 88, "confidence_label": "High", "references": ["https://docs.github.com/en/copilot/responsible-use-of-github-copilot-features"], "options": {"A": "It should be tested at least as rigorously as human-written code, including unit and security tests", "B": "It only needs manual testing, never automated tests", "C": "It needs less testing because the model was trained on tested code", "D": "It needs no testing if it compiles"}, "answer": "A", "explanation": "<p><strong>Correct answer: A</strong></p><p>AI-generated code warrants the same or greater testing rigor; its origin does not reduce the need for validation.</p><ul><li><strong>B</strong> — Automated tests are valuable for AI-generated code just as for human code.</li><li><strong>C</strong> — Training data being tested elsewhere does not validate your specific generated code.</li><li><strong>D</strong> — Compilation is not a substitute for testing.</li></ul>"}, {"id": 23, "objective": "Domain 1: Use GitHub Copilot responsibly", "type": "mc", "stem": "Why should organizations communicate that Copilot does not guarantee code is free of vulnerabilities?", "confidence": 82, "confidence_label": "Medium", "references": ["https://docs.github.com/en/copilot/responsible-use-of-github-copilot-features"], "options": {"A": "Because the disclaimer disables the vulnerability filter", "B": "To set realistic expectations and ensure security review remains part of the workflow", "C": "Because Copilot legally requires the disclaimer to be printed", "D": "Because it shifts all liability to individual developers"}, "answer": "B", "explanation": "<p><strong>Correct answer: B</strong></p><p>Communicating limitations keeps expectations realistic and preserves the role of security review.</p><ul><li><strong>A</strong> — Communication does not disable any filter.</li><li><strong>C</strong> — There is no legal print requirement at play here.</li><li><strong>D</strong> — The purpose is realistic expectations, not liability shifting.</li></ul>"}, {"id": 24, "objective": "Domain 1: Use GitHub Copilot responsibly", "type": "mc", "stem": "A developer is using Copilot on a safety-critical system. What additional responsibility applies?", "confidence": 88, "confidence_label": "High", "references": ["https://docs.github.com/en/copilot/responsible-use-of-github-copilot-features"], "options": {"A": "Disable testing to avoid slowing the safety pipeline", "B": "Use Copilot only after the system is deployed", "C": "No additional responsibility; Copilot handles safety automatically", "D": "Apply heightened verification, formal review, and domain-expert validation of all generated code"}, "answer": "D", "explanation": "<p><strong>Correct answer: D</strong></p><p>Safety-critical contexts demand heightened verification and expert validation beyond ordinary review.</p><ul><li><strong>A</strong> — Disabling testing in safety-critical work is dangerous and irresponsible.</li><li><strong>B</strong> — Verifying after deployment defeats the purpose of safety review.</li><li><strong>C</strong> — Copilot does not provide safety guarantees automatically.</li></ul>"}, {"id": 25, "objective": "Domain 1: Use GitHub Copilot responsibly", "type": "mc", "stem": "Which statement about Copilot and personal/sensitive data in suggestions is correct?", "confidence": 85, "confidence_label": "High", "references": ["https://docs.github.com/en/copilot/responsible-use-of-github-copilot-features", "https://docs.github.com/en/copilot/managing-copilot/managing-github-copilot-in-your-organization/setting-policies-for-copilot-in-your-organization/managing-policies-for-copilot-in-your-organization"], "options": {"A": "Sensitive data concerns apply only to chat, never to completions", "B": "Suggestions never contain anything resembling sensitive data", "C": "Developers should avoid pasting sensitive data into prompts and review suggestions for inadvertently exposed data", "D": "Sensitive data in prompts is automatically anonymized and safe to share"}, "answer": "C", "explanation": "<p><strong>Correct answer: C</strong></p><p>Developers should not paste sensitive data into prompts and should review output, since handling of such data carries privacy obligations.</p><ul><li><strong>A</strong> — The concern applies to both chat and completions.</li><li><strong>B</strong> — Suggestions can include patterns resembling sensitive data.</li><li><strong>D</strong> — Prompts are not guaranteed to anonymize sensitive data you provide.</li></ul>"}, {"id": 26, "objective": "Domain 1: Use GitHub Copilot responsibly", "type": "mc", "stem": "What is the recommended mindset when Copilot output conflicts with your team's coding standards?", "confidence": 84, "confidence_label": "Medium", "references": ["https://docs.github.com/en/copilot/responsible-use-of-github-copilot-features"], "options": {"A": "Change the team standards to match Copilot output", "B": "Accept the suggestion to avoid arguing with the tool", "C": "Adapt or reject the suggestion so the final code conforms to team standards", "D": "Escalate to GitHub support to resolve the conflict"}, "answer": "C", "explanation": "<p><strong>Correct answer: C</strong></p><p>The developer should make the final code conform to team standards, adapting or rejecting suggestions as needed.</p><ul><li><strong>A</strong> — Team standards exist for good reasons and should not bend to the tool.</li><li><strong>B</strong> — Accepting non-conforming code degrades the codebase.</li><li><strong>D</strong> — Standards conflicts are resolved by the developer, not GitHub support.</li></ul>"}, {"id": 27, "objective": "Domain 1: Use GitHub Copilot responsibly", "type": "mc", "stem": "Which approach best balances productivity with responsible use when adopting Copilot on a team?", "confidence": 87, "confidence_label": "High", "references": ["https://docs.github.com/en/copilot/responsible-use-of-github-copilot-features", "https://learn.microsoft.com/en-us/training/courses/gh-300"], "options": {"A": "Allow Copilot output to bypass review when deadlines are tight", "B": "Encourage Copilot use while keeping review, testing, and security gates mandatory for all code", "C": "Forbid any modification of Copilot suggestions to preserve intent", "D": "Mandate that Copilot generate the majority of code to prove ROI"}, "answer": "B", "explanation": "<p><strong>Correct answer: B</strong></p><p>Combining encouragement of the tool with non-negotiable review, testing, and security gates captures productivity gains without sacrificing accountability.</p><ul><li><strong>A</strong> — Bypassing review under deadline pressure is exactly when defects slip through.</li><li><strong>C</strong> — Forbidding edits prevents developers from correcting flawed output.</li><li><strong>D</strong> — Mandating a generation quota incentivizes misuse over quality.</li></ul>"}, {"id": 28, "objective": "Domain 1: Use GitHub Copilot responsibly", "type": "multi", "stem": "Which of the following are recognized limitations of GitHub Copilot that developers should keep in mind? (Choose three.)", "confidence": 88, "confidence_label": "High", "references": ["https://docs.github.com/en/copilot/responsible-use-of-github-copilot-features", "https://resources.github.com/learn/pathways/copilot/essentials/establishing-trust-in-using-github-copilot/"], "options": {"A": "It can hallucinate non-existent APIs or facts", "B": "It can suggest insecure or vulnerable code patterns", "C": "It can reflect biases present in its training data", "D": "It formally verifies all generated code for correctness", "E": "It guarantees suggestions are free of licensing concerns"}, "answer": ["A", "B", "C"], "explanation": "<p><strong>Correct answers: A, B, C</strong></p><ul><li><strong>A</strong> (correct) — Hallucinations are a known limitation of generative models.</li><li><strong>B</strong> (correct) — Suggestions can contain insecure patterns and must be reviewed.</li><li><strong>C</strong> (correct) — Training data biases can surface in suggestions.</li><li><strong>D</strong> (incorrect) — Copilot does not formally verify correctness.</li><li><strong>E</strong> (incorrect) — Licensing concerns can still arise; no such guarantee exists.</li></ul>"}, {"id": 29, "objective": "Domain 1: Use GitHub Copilot responsibly", "type": "multi", "stem": "Which actions support responsible, ethical use of GitHub Copilot? (Choose three.)", "confidence": 89, "confidence_label": "High", "references": ["https://docs.github.com/en/copilot/responsible-use-of-github-copilot-features"], "options": {"A": "Reviewing and testing generated code before committing", "B": "Using duplicate detection / code referencing to address licensing", "C": "Keeping a human in the loop for accept/reject decisions", "D": "Committing suggestions without review to maximize speed", "E": "Pasting production secrets into prompts for accurate results"}, "answer": ["A", "B", "C"], "explanation": "<p><strong>Correct answers: A, B, C</strong></p><ul><li><strong>A</strong> (correct) — Review and testing are core responsible-use practices.</li><li><strong>B</strong> (correct) — These features help manage licensing and duplication risk.</li><li><strong>C</strong> (correct) — Human oversight preserves accountability.</li><li><strong>D</strong> (incorrect) — Skipping review is the opposite of responsible use.</li><li><strong>E</strong> (incorrect) — Never paste secrets into prompts; it creates privacy/security risk.</li></ul>"}, {"id": 30, "objective": "Domain 1: Use GitHub Copilot responsibly", "type": "multi", "stem": "A reviewer is evaluating AI-assisted code in a pull request. Which concerns are appropriate to check? (Choose three.)", "confidence": 85, "confidence_label": "High", "references": ["https://docs.github.com/en/copilot/responsible-use-of-github-copilot-features"], "options": {"A": "Security vulnerabilities and unsafe patterns", "B": "Licensing of code that matches public sources", "C": "Whether requirements and edge cases are actually met", "D": "Whether the developer used the keyboard or mouse to accept", "E": "The exact model temperature used during generation"}, "answer": ["A", "B", "C"], "explanation": "<p><strong>Correct answers: A, B, C</strong></p><ul><li><strong>A</strong> (correct) — Security review is essential for AI-assisted code.</li><li><strong>B</strong> (correct) — Licensing of matched public code is a legitimate concern.</li><li><strong>C</strong> (correct) — Confirming requirements and edge cases is core review work.</li><li><strong>D</strong> (incorrect) — How a suggestion was accepted is irrelevant to code quality.</li><li><strong>E</strong> (incorrect) — There is no user-exposed temperature to audit per suggestion.</li></ul>"}, {"id": 31, "objective": "Domain 1: Use GitHub Copilot responsibly", "type": "multi", "stem": "Which statements about accountability for Copilot-generated code are TRUE? (Choose two.)", "confidence": 88, "confidence_label": "High", "references": ["https://docs.github.com/en/copilot/responsible-use-of-github-copilot-features", "https://learn.microsoft.com/en-us/training/courses/gh-300"], "options": {"A": "The developer who commits the code is responsible for it", "B": "Standard review, testing, and security gates still apply", "C": "GitHub assumes liability for any bug Copilot introduces", "D": "AI-generated code is exempt from organizational policy"}, "answer": ["A", "B"], "explanation": "<p><strong>Correct answers: A, B</strong></p><ul><li><strong>A</strong> (correct) — The committing developer is accountable.</li><li><strong>B</strong> (correct) — Existing quality gates continue to apply.</li><li><strong>C</strong> (incorrect) — GitHub does not assume liability for your commits.</li><li><strong>D</strong> (incorrect) — Organizational policy applies to AI-generated code as well.</li></ul>"}, {"id": 32, "objective": "Domain 1: Use GitHub Copilot responsibly", "type": "multi", "stem": "Which are good ways to reduce the risk of accepting hallucinated Copilot output? (Choose three.)", "confidence": 87, "confidence_label": "High", "references": ["https://docs.github.com/en/copilot/responsible-use-of-github-copilot-features"], "options": {"A": "Cross-checking referenced APIs against official documentation", "B": "Running the code and its tests to confirm behavior", "C": "Asking Copilot Chat to explain and justify the suggestion", "D": "Assuming confident phrasing means the output is correct", "E": "Accepting any suggestion that compiles without warnings"}, "answer": ["A", "B", "C"], "explanation": "<p><strong>Correct answers: A, B, C</strong></p><ul><li><strong>A</strong> (correct) — Verifying APIs against docs catches invented calls.</li><li><strong>B</strong> (correct) — Executing tests reveals incorrect behavior.</li><li><strong>C</strong> (correct) — Asking for an explanation can expose flawed reasoning.</li><li><strong>D</strong> (incorrect) — Confidence of phrasing is not evidence of correctness.</li><li><strong>E</strong> (incorrect) — Compiling cleanly does not prove correctness.</li></ul>"}, {"id": 33, "objective": "Domain 1: Use GitHub Copilot responsibly", "type": "hotspot", "stem": "For each statement about responsible Copilot use, select whether it is True or False.", "confidence": 86, "confidence_label": "High", "references": ["https://docs.github.com/en/copilot/responsible-use-of-github-copilot-features"], "rows": [{"label": "Copilot suggestions should always be reviewed before committing", "options": ["True", "False"]}, {"label": "Copilot guarantees generated code is free of vulnerabilities", "options": ["True", "False"]}, {"label": "The developer who commits AI-assisted code is accountable for it", "options": ["True", "False"]}], "answer": [{"row": "Copilot suggestions should always be reviewed before committing", "correct": "True"}, {"row": "Copilot guarantees generated code is free of vulnerabilities", "correct": "False"}, {"row": "The developer who commits AI-assisted code is accountable for it", "correct": "True"}], "explanation": "<p><strong>Responsible use centers on human oversight, review, and awareness of model limitations.</strong></p><ul><li><strong>Copilot suggestions should always be reviewed before committing: True</strong> — Human review is a core responsible-use practice.</li><li><strong>Copilot guarantees generated code is free of vulnerabilities: False</strong> — No such guarantee exists; security review is still required.</li><li><strong>The developer who commits AI-assisted code is accountable for it: True</strong> — Accountability stays with the human who commits the code.</li></ul>"}, {"id": 34, "objective": "Domain 1: Use GitHub Copilot responsibly", "type": "hotspot", "stem": "Match each concern to the most appropriate responsible-use safeguard.", "confidence": 85, "confidence_label": "High", "references": ["https://docs.github.com/en/copilot/responsible-use-of-github-copilot-features"], "rows": [{"label": "Suggestion matches public code (licensing)", "options": ["Code referencing / duplicate detection", "Increase font size", "Disable tests"]}, {"label": "Suggestion may be insecure", "options": ["Security review and SAST", "Accept automatically", "Ignore"]}, {"label": "Suggestion may be a hallucination", "options": ["Verify against documentation and tests", "Trust confident wording", "Rename variables"]}], "answer": [{"row": "Suggestion matches public code (licensing)", "correct": "Code referencing / duplicate detection"}, {"row": "Suggestion may be insecure", "correct": "Security review and SAST"}, {"row": "Suggestion may be a hallucination", "correct": "Verify against documentation and tests"}], "explanation": "<p><strong>Each risk maps to a concrete mitigation built into a responsible workflow.</strong></p><ul><li><strong>Suggestion matches public code (licensing): Code referencing / duplicate detection</strong> — Code referencing surfaces matches and licenses.</li><li><strong>Suggestion may be insecure: Security review and SAST</strong> — Security tooling and review catch insecure patterns.</li><li><strong>Suggestion may be a hallucination: Verify against documentation and tests</strong> — Verification against docs and tests reveals invented or wrong output.</li></ul>"}, {"id": 35, "objective": "Domain 2: Use GitHub Copilot features", "type": "mc", "stem": "Which GitHub Copilot plan is designed for individual developers who pay for their own subscription and is free for verified students, teachers, and maintainers of popular open-source projects?", "confidence": 86, "confidence_label": "High", "references": ["https://docs.github.com/en/copilot/about-github-copilot/subscription-plans-for-github-copilot"], "options": {"A": "Copilot Workspace", "B": "Copilot Individual (Copilot Pro)", "C": "Copilot Enterprise", "D": "Copilot Business"}, "answer": "B", "explanation": "<p><strong>Correct answer: B</strong></p><p>Copilot Individual (now Copilot Pro) targets single developers and is offered free to verified students, teachers, and popular open-source maintainers.</p><ul><li><strong>A</strong> — Copilot Workspace is a separate task-oriented experience, not the individual subscription tier.</li><li><strong>C</strong> — Copilot Enterprise is an organization-wide plan with additional features.</li><li><strong>D</strong> — Copilot Business is purchased and managed by organizations, not individuals.</li></ul>"}, {"id": 36, "objective": "Domain 2: Use GitHub Copilot features", "type": "mc", "stem": "An organization wants centralized license management, policy controls, and exclusion of their data from training. Which plan should they choose at minimum?", "confidence": 87, "confidence_label": "High", "references": ["https://docs.github.com/en/copilot/about-github-copilot/subscription-plans-for-github-copilot", "https://docs.github.com/en/copilot/managing-copilot/managing-github-copilot-in-your-organization/setting-policies-for-copilot-in-your-organization/managing-policies-for-copilot-in-your-organization"], "options": {"A": "Copilot Free", "B": "A personal GitHub account with Copilot Pro", "C": "Copilot Business", "D": "Copilot Individual"}, "answer": "C", "explanation": "<p><strong>Correct answer: C</strong></p><p>Copilot Business provides organization-level license management, policy controls, and excludes business data from training by default.</p><ul><li><strong>A</strong> — Copilot Free is a limited tier without organization policy management.</li><li><strong>B</strong> — Personal Pro accounts are managed by the individual, not the organization.</li><li><strong>D</strong> — Copilot Individual lacks organization-wide policy and license management.</li></ul>"}, {"id": 37, "objective": "Domain 2: Use GitHub Copilot features", "type": "mc", "stem": "Which feature is unique to Copilot Enterprise compared with Copilot Business?", "confidence": 84, "confidence_label": "Medium", "references": ["https://docs.github.com/en/copilot/about-github-copilot/subscription-plans-for-github-copilot"], "options": {"A": "Knowledge bases and Copilot Chat in GitHub.com with organization-indexed context", "B": "Copilot Chat inside VS Code", "C": "Inline code completion in the editor", "D": "The ability to accept suggestions with the Tab key"}, "answer": "A", "explanation": "<p><strong>Correct answer: A</strong></p><p>Copilot Enterprise adds organization-wide capabilities such as knowledge bases and Copilot Chat on GitHub.com tailored to your repositories.</p><ul><li><strong>B</strong> — Chat in VS Code is available in Business and Individual as well.</li><li><strong>C</strong> — Inline completion is available across paid tiers, not unique to Enterprise.</li><li><strong>D</strong> — Tab-to-accept is a basic editor behavior available to all tiers.</li></ul>"}, {"id": 38, "objective": "Domain 2: Use GitHub Copilot features", "type": "mc", "stem": "In Visual Studio Code, which keyboard action accepts the entire inline (ghost text) suggestion shown by Copilot?", "confidence": 88, "confidence_label": "High", "references": ["https://docs.github.com/en/copilot/using-github-copilot/getting-code-suggestions-in-your-ide-with-github-copilot"], "options": {"A": "Press the Tab key", "B": "Press Esc", "C": "Press Shift+Enter", "D": "Press Ctrl+S"}, "answer": "A", "explanation": "<p><strong>Correct answer: A</strong></p><p>Tab accepts the full inline 'ghost text' suggestion in VS Code.</p><ul><li><strong>B</strong> — Esc dismisses the suggestion rather than accepting it.</li><li><strong>C</strong> — Shift+Enter inserts a newline; it does not accept the suggestion.</li><li><strong>D</strong> — Ctrl+S saves the file; es", "type": "mc", "stem": "In Copilot Chat, which reference is used to include the contents of a specific file as context?", "confidence": 83, "confidence_label": "Medium", "references": ["https://docs.github.com/en/copilot/using-github-copilot/copilot-chat"], "options": {"A": "@file", "B": "/file", "C": "#file", "D": "$file"}, "answer": "C", "explanation": "<p><strong>Correct answer: C</strong></p><p>The #file reference (a context variable) attaches a specific file's contents to the chat prompt.</p><ul><li><strong>A</strong> — @ prefixes chat participants, not file references.</li><li><strong>B</strong> — / prefixes slash commands like /explain or /tests.</li><li><strong>D</strong> — $file is not a Copilot Chat reference syntax.</li></ul>"}, {"id": 42, "objective": "Domain 2: Use GitHub Copilot features", "type": "mc", "stem": "Which Copilot Chat slash command generates unit tests for the selected code?", "confidence": 87, "confidence_label": "High", "references": ["https://docs.github.com/en/copilot/using-github-copilot/copilot-chat"], "options": {"A": "/optimize", "B": "/fix", "C": "/tests", "D": "/explain"}, "answer": "C", "explanation": "<p><strong>Correct answer: C</strong></p><p>/tests asks Copilot Chat to generate unit tests for the selected or referenced code.</p><ul><li><strong>A</strong> — /optimize is not the standard command for generating tests.</li><li><strong>B</strong> — /fix proposes a fix for a problem in the code.</li><li><strong>D</strong> — /explain describes what the selected code does.</li></ul>"}, {"id": 43, "objective": "Domain 2: Use GitHub Copilot features", "type": "mc", "stem": "Which Copilot Chat slash command asks Copilot to explain what a selected block of code does?", "confidence": 86, "confidence_label": "High", "references": ["https://docs.github.com/en/copilot/using-github-copilot/copilot-chat"], "options": {"A": "/doc", "B": "/describe", "C": "/explain", "D": "/why"}, "answer": "C", "explanation": "<p><strong>Correct answer: C</strong></p><p>/explain produces a natural-language explanation of the selected code.</p><ul><li><strong>A</strong> — /doc generates documentation comments rather than an explanation in chat.</li><li><strong>B</strong> — /describe is not a standard Copilot Chat slash command.</li><li><strong>D</strong> — /why is not a standard Copilot Chat slash command.</li></ul>"}, {"id": 44, "objective": "Domain 2: Use GitHub Copilot features", "type": "mc", "stem": "A developer types `gh copilot suggest` in the terminal. What does the GitHub Copilot CLI do?", "confidence": 85, "confidence_label": "High", "references": ["https://docs.github.com/en/copilot/github-copilot-in-the-cli"], "options": {"A": "Suggests a shell command (or git/gh command) for the described task", "B": "Opens the VS Code editor with a new file", "C": "Commits all staged changes automatically", "D": "Generates unit tests for the current directory"}, "answer": "A", "explanation": "<p><strong>Correct answer: A</strong></p><p>`gh copilot suggest` asks Copilot in the CLI to propose a command for a natural-language task description.</p><ul><li><strong>B</strong> — It does not open an editor; it works in the terminal.</li><li><strong>C</strong> — It does not auto-commit changes.</li><li><strong>D</strong> — Generating unit tests is a Chat/IDE capability, not `gh copilot suggest`.</li></ul>"}, {"id": 45, "objective": "Domain 2: Use GitHub Copilot features", "type": "mc", "stem": "Which GitHub Copilot CLI command explains what a given shell command does in plain language?", "confidence": 85, "confidence_label": "High", "references": ["https://docs.github.com/en/copilot/github-copilot-in-the-cli"], "options": {"A": "gh copilot run", "B": "gh copilot help", "C": "gh copilot describe", "D": "gh copilot explain"}, "answer": "D", "explanation": "<p><strong>Correct answer: D</strong></p><p>`gh copilot explain` takes a command and returns a natural-language explanation of it.</p><ul><li><strong>A</strong> — `gh copilot run u prompt Copilot directly in the editor to make targeted edits or generate code in place.</p><ul><li><strong>A</strong> — It does not disable ghost-text suggestions.</li><li><strong>B</strong> — It does not replace the terminal.</li><li><strong>C</strong> — It does not open external browser tabs.</li></ul>"}, {"id": 48, "objective": "Domain 2: Use GitHub Copilot features", "type": "mc", "stem": "Which Copilot Chat participant is best suited to help compose or explain a terminal command and run it in the integrated terminal?", "confidence": 82, "confidence_label": "Medium", "references": ["https://docs.github.com/en/copilot/using-github-copilot/copilot-chat"], "options": {"A": "@terminal", "B": "@docs", "C": "@file", "D": "@workspace"}, "answer": "A", "explanation": "<p><strong>Correct answer: A</strong></p><p>@terminal focuses Copilot Chat on the integrated terminal, helping craft and explain shell commands.</p><ul><li><strong>B</strong> — @docs is not the terminal-focused participant.</li><li><strong>C</strong> — @file is a context reference syntax, not a terminal participant.</li><li><strong>D</strong> — @workspace reasons across the repository's code, not terminal commands.</li></ul>"}, {"id": 49, "objective": "Domain 2: Use GitHub Copilot features", "type": "mc", "stem": "How does Copilot typically trigger an inline code-completion suggestion as you work?", "confidence": 85, "confidence_label": "High", "references": ["https://docs.github.com/en/copilot/using-github-copilot/getting-code-suggestions-in-your-ide-with-github-copilot"], "options": {"A": "Only when you press a dedicated 'Generate' button in the menu bar", "B": "Only when connected to a local model", "C": "Automatically as you type, based on the surrounding code and comments", "D": "Only after you save the file"}, "answer": "C", "explanation": "<p><strong>Correct answer: C</strong></p><p>Copilot offers inline suggestions automatically based on context as you type; you can also invoke them manually.</p> ation": "<p><strong>Correct answer: B</strong></p><p>Copilot Free provides a capped monthly allowance of completions and chat messages without charge.</p><ul><li><strong>A</strong> — Knowledge bases are an Enterprise feature, not part of Copilot Free.</li><li><strong>C</strong> — The free tier is limited and lacks enterprise policy controls.</li><li><strong>D</strong> — Copilot Free is available to individual accounts.</li></ul>"}, {"id": 52, "objective": "Domain 2: Use GitHub Copilot features", "type": "mc", "stem": "In Copilot Chat, what does the /fix slash command do?", "confidence": 84, "confidence_label": "Medium", "references": ["https://docs.github.com/en/copilot/using-github-copilot/copilot-chat"], "options": {"A": "Proposes a fix for a detected problem or error in the selected code", "B": "Formats the document using the default formatter", "C": "Permanently disables linting for the file", "D": "Reverts the file to the last commit"}, "answer": "A", "explanation": "<p><strong>Correct answer: A</strong></p><p>/fix asks Copilot to suggest a correction for an issue in the selected code.</p><ul><li><strong>B</strong> — Formatting is a separate editor action, not /fix.</li><li><strong>C</strong> — It does not disable linting.</li><li><strong>D</strong> — It does not perform a git revert.</li></ul>"}, {"id": 53, "objective": "Domain 2: Use GitHub Copilot features", "type": "mc", "stem": "Which Copilot capability allows asking questions about your code on GitHub.com (the web) with repository-aware answers, available in Copilot Enterprise?", "confidence": 82, "confidence_label": "Medium", "references": ["https://docs.github.com/en/copilot/about-github-copilot/subscription-plans-for-github-copilot", "https://docs.github.com/en/copilot/using-github-copilot/copilot-chat"], "options": {"A": "Copilot Chat in GitHub.com", "B": "Copilot in the JetBrains Gateway", "C": "Copilot CLI suggest", "D": "Copilot inline ghost text"}, "answer": "A", "explanation": "<p><strong>Correct bes what a command does.</li><li><strong>C</strong> (incorrect) — There is no deploy subcommand.</li><li><strong>D</strong> (incorrect) — There is no mine subcommand.</li></ul>"}, {"id": 82, "objective": "Domain 2: Use GitHub Copilot features", "type": "multi", "stem": "Which are valid ways to interact with an inline Copilot suggestion in VS Code? (Choose three.)", "confidence": 84, "confidence_label": "Medium", "references": ["https://docs.github.com/en/copilot/using-github-copilot/getting-code-suggestions-in-your-ide-with-github-copilot"], "options": {"A": "Accept the whole suggestion with Tab", "B": "Dismiss it with Esc", "C": "Accept the next word with Ctrl+Right Arrow", "D": "Compile the suggestion with F5 to accept it", "E": "Email the suggestion to accept it"}, "answer": ["A", "B", "C"], "explanation": "<p><strong>Correct answers: A, B, C</strong></p><ul><li><strong>A</strong> (correct) — Tab accepts the full suggestion.</li><li><strong>B</strong> (correct) — Esc dismisses the suggestion.</li><li><strong>C</strong> (correct) — Ctrl+Right Arrow accepts word-by-word.</li><li><strong>D</strong> (incorrect) — F5 starts debugging; it does not accept suggestions.</li><li><strong>E</strong> (incorrect) — Emailing is not an acceptance mechanism.</li></ul>"}, {"id": 83, "objective": "Domain 2: Use GitHub Copilot features", "type": "multi", "stem": "Which capabilities are typically associated with Copilot Enterprise (beyond Business)? (Choose two.)", "confidence": 82, "confidence_label": "Medium", "references": ["https://docs.github.com/en/copilot/about-github-copilot/subscription-plans-for-github-copilot"], "options": {"A": "Organization knowledge bases for grounding answers", "B": "Copilot Chat on GitHub.com tailored to your repos", "C": "Inline ghost-text completions in the editor", "D": "Tab to accept a suggestion"}, "answer": ["A", "B"], "explanation": "<p><strong>Correct answers: A, B</strong></p><ul><li><strong>A</strong> (correct) — Knowledge bases are an Enterprise capability.</li><li><strong>B</strong> (correct) — Repo-aware Chat on GitHub.com is part of Enterprise.</li><li><strong>C</strong> (incorrect) — Inline completions exist across paid tiers, not unique to Enterprise.</li><li><strong>D</strong> (incorrect) — Tab-to-accept is a basic editor behavior in all tiers.</li></ul>"}, {"id": 84, "objective": "Domain 2: Use GitHub Copilot features", "type": "multi", "stem": "Which Copilot Chat references/participants help provide context? (Choose three.)", "confidence": 84, "confidence_label": "Medium", "references": ["https://docs.github.com/en/copilot/using-github-copilot/copilot-chat"], "options": {"A": "@workspace", "B": "#file", "C": "@terminal", "D": "@printer", "E": "#wifi"}, "answer": ["A", "B", "C"], "explanation": "<p><strong>Correct answers: A, B, C</strong></p><ul><li><strong>A</strong> (correct) — @workspace scopes to the whole repository.</li><li><strong>B</strong> (correct) — #file attaches a specific file's contents.</li><li><strong>C</strong> (correct) — @terminal focuses on the integrated terminal.</li><li><strong>D</strong> (incorrect) — @printer is not a Copilot participant.</li><li><strong>E</strong> (incorrect) — #wifi is not a Copilot context reference.</li></ul>"}, {"id": 85, "objective": "Domain 2: Use GitHub Copilot features", "type": "multi", "stem": "Which statements about installing Copilot in IDEs are TRUE? (Choose two.)", "confidence": 85, "confidence_label": "High", "references": ["https://docs.github.com/en/copilot/using-github-copilot/getting-code-suggestions-in-your-ide-with-github-copilot"], "options": {"A": "VS Code uses the GitHub Copilot extension from the marketplace", "B": "JetBrains IDEs use the Copilot plugin from the JetBrains Marketplace", "C": "Copilot is preinstalled in every text editor by default", "D": "Copilot requires no GitHub account to function"}, "answer": ["A", "B"], "explanation": "<p><strong>Correct answers: A, B</strong></p><ul><li><strong>A</strong> (correct) — VS
