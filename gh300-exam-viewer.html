><strong>Plan features differ across Individual, Business, and Enterprise.</strong></p><ul><li><strong>Business excludes prompts/suggestions from training: Included</strong> — Business excludes business data from training by default.</li><li><strong>Enterprise provides organization knowledge bases: Included</strong> — Knowledge bases are an Enterprise capability.</li><li><strong>Individual provides org-wide policy management: Not included</strong> — Org-wide policy management requires Business/Enterprise.</li></ul>"}, {"id": 89, "objective": "Domain 3: Understand Copilot data and architecture", "type": "mc", "stem": "At a high level, how does GitHub Copilot generate an inline suggestion?", "confidence": 87, "confidence_label": "High", "references": ["https://docs.github.com/en/copilot", "https://docs.github.com/en/copilot/responsible-use-of-github-copilot-features"], "options": {"A": "It downloads the answer from a fixed lookup table shipped with the extension", "B": "It builds a prompt from your context and sends it to a cloud-hosted large language model, which returns a completion", "C": "It searches a local database of copied snippets on your disk", "D": "It compiles your project and predicts the output binary"}, "answer": "B", "explanation": "<p><strong>Correct answer: B</strong></p><p>Copilot assembles context into a prompt and uses a cloud-hosted LLM to produce a completion that is returned to the editor.</p><ul><li><strong>A</strong> — There is no fixed shipped lookup table of answers.</li><li><strong>C</strong> — Copilot does not maintain a local snippet database for matching.</li><li><strong>D</strong> — It does not compile your project to predict binaries.</li></ul>"}, {"id": 90, "objective": "Domain 3: Understand Copilot data and architecture", "type": "mc", "stem": "What is the 'context window' in the context of a Copilot model?", "confidence": 86, "confidence_label": "High", "references": ["https://docs.github.com/en/copilot", "https://docs.github.com/en/copilot/using-github-copilot/prompt-engineering-for-github-copilot"], "options": {"A": "The maximum amount of tokens (prompt plus completion) the model can process at once", "B": "The visible area of the editor on screen", "C": "The number of files open in the workspace", "D": "The time window during which suggestions are cached"}, "answer": "A", "explanation": "<p><strong>Correct answer: A</strong></p><p>The context window is the token limit the model can consider for the combined prompt and response.</p><ul><li><strong>B</strong> — It is not the on-screen editor viewport.</li><li><strong>C</strong> — It is measured in tokens, not the count of open files.</li><li><strong>D</strong> — It is not a caching time interval.</li></ul>"}, {"id": 91, "objective": "Domain 3: Understand Copilot data and architecture", "type": "mc", "stem": "Which best describes a 'prompt' that Copilot sends to the model for code completion?", "confidence": 85, "confidence_label": "High", "references": ["https://docs.github.com/en/copilot/using-github-copilot/prompt-engineering-for-github-copilot", "https://docs.github.com/en/copilot"], "options": {"A": "The entire git history of the repository", "B": "A screenshot of the editor", "C": "An assembled payload that includes surrounding code, related snippets, and the cursor position", "D": "Only the single word directly before the cursor"}, "answer": "C", "explanation": "<p><strong>Correct answer: C</strong></p><p>Copilot constructs a prompt from relevant context such as the surrounding code, related snippets, and cursor position.</p><ul><li><strong>A</strong> — It does not send the entire git history.</li><li><strong>B</strong> — It sends text context, not screenshots.</li><li><strong>D</strong> — It uses more than just the single preceding word.</li></ul>"}, {"id": 92, "objective": "Domain 3: Understand Copilot data and architecture", "type": "mc", "stem": "What is telemetry in the context of GitHub Copilot?", "confidence": 84, "confidence_label": "Medium", "references": ["https://docs.github.com/en/copilot/managing-copilot/managing-github-copilot-in-your-organization/managing-policies-and-features-for-copilot-in-your-organization", "https://docs.github.com/en/copilot/managing-copilot/managing-github-copilot-in-your-organization/setting-policies-for-copilot-in-your-organization/managing-policies-for-copilot-in-your-organization"], "options": {"A": "The list of installed VS Code themes", "B": "The model weights stored on the developer's machine", "C": "The encryption keys used for TLS", "D": "Usage and performance data collected to operate and improve the service, subject to policy settings"}, "answer": "D", "explanation": "<p><strong>Correct answer: D</strong></p><p>Telemetry refers to usage/performance data collected for service operation and improvement, governed by configurable policies.</p><ul><li><strong>A</strong> — Installed themes are not Copilot telemetry.</li><li><strong>B</strong> — Model weights are not telemetry and are not stored locally.</li><li><strong>C</strong> — TLS keys are unrelated to telemetry data.</li></ul>"}, {"id": 93, "objective": "Domain 3: Understand Copilot data and architecture", "type": "mc", "stem": "For Copilot Business and Enterprise, what is the default policy regarding using your prompts and suggestions to train the model?", "confidence": 85, "confidence_label": "High", "references": ["https://docs.github.com/en/copilot/managing-copilot/managing-github-copilot-in-your-organization/setting-policies-for-copilot-in-your-organization/managing-policies-for-copilot-in-your-organization", "https://docs.github.com/en/copilot/about-github-copilot/subscription-plans-for-github-copilot"], "options": {"A": "They are emailed to the organization owner daily", "B": "They are always used to train the model with no option to opt out", "C": "They are excluded from being used to train the foundational model by default", "D": "They are published publicly for transparency"}, "answer": "C", "explanation": "<p><strong>Correct answer: C</strong></p><p>Business and Enterprise exclude prompts and suggestions from model training by default.</p><ul><li><strong>A</strong> — They are not emailed to owners.</li><li><strong>B</strong> — There is an exclusion by default, not mandatory training use.</li><li><strong>D</strong> — Prompts are not published publicly.</li></ul>"}, {"id": 94, "objective": "Domain 3: Understand Copilot data and architecture", "type": "mc", "stem": "Why does providing more relevant open files improve Copilot suggestions?", "confidence": 84, "confidence_label": "Medium", "references": ["https://docs.github.com/en/copilot/using-github-copilot/prompt-engineering-for-github-copilot", "https://docs.github.com/en/copilot"], "options": {"A": "Copilot can include relevant snippets from open files as additional context within the model's window", "B": "Open files increase the model's parameter count", "C": "Open files disable the cloud connection", "D": "Open files change the model architecture"}, "answer": "A", "explanation": "<p><strong>Correct answer: A</strong></p><p>Copilot can draw on relevant content from open files to enrich the prompt context, improving relevance.</p><ul><li><strong>B</strong> — Open files do not alter the model's parameter count.</li><li><strong>C</strong> — They do not disable cloud connectivity.</li><li><strong>D</strong> — They do not change the model architecture.</li></ul>"}, {"id": 95, "objective": "Domain 3: Understand Copilot data and architecture", "type": "mc", "stem": "What is a 'token' in the context of LLM-based tools like Copilot?", "confidence": 83, "confidence_label": "Medium", "references": ["https://docs.github.com/en/copilot"], "options": {"A": "A compiled object file", "B": "A chunk of text (often a word piece) that the model processes as a unit", "C": "A security credential for authenticating to GitHub", "D": "A unit of the monthly billing currency"}, "answer": "B", "explanation": "<p><strong>Correct answer: B</strong></p><p>In LLMs, a token is a unit of text (such as a sub-word) the model consumes and produces.</p><ul><li><strong>A</strong> — It is not a compiled object file.</li><li><strong>C</strong> — Here 'token' refers to text units, not an auth credential, despite the overloaded term.</li><li><strong>D</strong> — It is not a billing currency unit.</li></ul>"}, {"id": 96, "objective": "Domain 3: Understand Copilot data and architecture", "type": "mc", "stem": "Which statement about where Copilot inference runs is correct?", "confidence": 85, "confidence_label": "High", "references": ["https://docs.github.com/en/copilot"], "options": {"A": "Inference runs in the browser using WebAssembly only", "B": "Inference runs on the developer's GPU with no network use", "C": "Inference runs on cloud-hosted models operated by GitHub and its model providers", "D": "Inference runs entirely offline on the developer's CPU"}, "answer": "C", "explanation": "<p><strong>Correct answer: C</strong></p><p>Copilot relies on cloud-hosted models; the editor sends prompts and receives completions over the network.</p><ul><li><strong>A</strong> — It does not run purely in-browser via WebAssembly.</li><li><strong>B</strong> — It is not a local GPU-only process without network.</li><li><strong>D</strong> — It is not an offline on-device process.</li></ul>"}, {"id": 97, "objective": "Domain 3: Understand Copilot data and architecture", "type": "mc", "stem": "What happens to the prompt context after a suggestion is generated for a Business/Enterprise user, per default data handling?", "confidence": 82, "confidence_label": "Medium", "references": ["https://docs.github.com/en/copilot/managing-copilot/managing-github-copilot-in-your-organization/setting-policies-for-copilot-in-your-organization/managing-policies-for-copilot-in-your-organization"], "options": {"A": "It is stored as model weights", "B": "It is not retained to train the foundational model by default", "C": "It is permanently added to the public training corpus", "D": "It is shared with other customers"}, "answer": "B", "explanation": "<p><strong>Correct answer: B</strong></p><p>By default, Business/Enterprise prompts are not used to train the foundational model and are not shared with other customers.</p><ul><li><strong>A</strong> — Prompts do not become model weights.</li><li><strong>C</strong> — It is not added to a public training corpus by default.</li><li><strong>D</strong> — Prompts are not shared with other customers.</li></ul>"}, {"id": 98, "objective": "Domain 3: Understand Copilot data and architecture", "type": "mc", "stem": "Which factor most directly limits how much surrounding code Copilot can consider for a single suggestion?", "confidence": 85, "confidence_label": "High", "references": ["https://docs.github.com/en/copilot", "https://docs.github.com/en/copilot/using-github-copilot/prompt-engineering-for-github-copilot"], "options": {"A": "The number of CPU cores", "B": "The length of the file name", "C": "The editor's zoom level", "D": "The model's context window (token limit)"}, "answer": "D", "explanation": "<p><strong>Correct answer: D</strong></p><p>The token-based context window bounds how much context can be included in a single request.</p><ul><li><strong>A</strong> — CPU cores do not change the cloud model's context window.</li><li><strong>B</strong> — File name length is irrelevant to context capacity.</li><li><strong>C</strong> — Editor zoom does not affect context size.</li></ul>"}, {"id": 99, "objective": "Domain 3: Understand Copilot data and architecture", "type": "mc", "stem": "Why might two developers receive different suggestions for the same line of code?", "confidence": 84, "confidence_label": "Medium", "references": ["https://docs.github.com/en/copilot"], "options": {"A": "Copilot assigns a fixed suggestion per user ID", "B": "Suggestions depend on the operating system version only", "C": "The model is retrained between the two requests", "D": "Their surrounding context, open files, and the probabilistic nature of the model differ"}, "answer": "D", "explanation": "<p><strong>Correct answer: D</strong></p><p>Different context plus the model's probabilistic generation lead to varied suggestions.</p><ul><li><strong>A</strong> — Suggestions are not fixed per user ID.</li><li><strong>B</strong> — OS version is not the determining factor.</li><li><strong>C</strong> — The model is not retrained between individual requests.</li></ul>"}, {"id": 100, "objective": "Domain 3: Understand Copilot data and architecture", "type": "mc", "stem": "What is the role of a 'system prompt' or instructions in Copilot's architecture?", "confidence": 78, "confidence_label": "Medium", "references": ["https://docs.github.com/en/copilot"], "options": {"A": "A prompt that changes the developer's OS settings", "B": "A prompt that disables the network", "C": "A prompt that uninstalls the extension", "D": "Guidance that shapes how the model responds, combined with the user's context"}, "answer": "D", "explanation": "<p><strong>Correct answer: D</strong></p><p>System-level instructions guide model behavior and are combined with user context to produce responses.</p><ul><li><strong>A</strong> — It does not modify OS settings.</li><li><strong>B</strong> — It does not disable the network.</li><li><strong>C</strong> — It does not uninstall the extension.</li></ul>"}]}, {"number": 3, "questions": [{"id": 101, "objective": "Domain 3: Understand Copilot data and architecture", "type": "mc", "stem": "How does Copilot Chat typically maintain continuity across a multi-turn conversation?", "confidence": 82, "confidence_label": "Medium", "references": ["https://docs.github.com/en/copilot/using-github-copilot/copilot-chat", "https://docs.github.com/en/copilot"], "options": {"A": "It includes prior messages from the conversation as part of the context, within the window limit", "B": "It re-trains the model after each message", "C": "It stores the full conversation as model weights", "D": "It ignores all prior messages entirely"}, "answer": "A", "explanation": "<p><strong>Correct answer: A</strong></p><p>Chat includes earlier turns as context (subject to the window) to maintain continuity.</p><ul><li><strong>B</strong> — The model is not retrained per message.</li><li><strong>C</strong> — Conversations are not stored as weights.</li><li><strong>D</strong> — Prior messages are used, not ignored, when they fit the window.</li></ul>"}, {"id": 102, "objective": "Domain 3: Understand Copilot data and architecture", "type": "mc", "stem": "Which is an accurate description of how content exclusions affect Copilot's data flow?", "confidence": 83, "confidence_label": "Medium", "references": ["https://docs.github.com/en/copilot/managing-copilot/configuring-and-auditing-content-exclusion", "https://docs.github.com/en/copilot/managing-copilot/managing-github-copilot-in-your-organization/setting-policies-for-copilot-in-your-organization/managing-policies-for-copilot-in-your-organization"], "options": {"A": "Excluded files are uploaded to a public repository", "B": "Excluded files are encrypted but still used as context", "C": "Excluded files are not used as context and do not inform suggestions", "D": "Excluded files are compiled before exclusion"}, "answer": "C", "explanation": "<p><strong>Correct answer: C</strong></p><p>Content exclusion prevents specified files from being used as Copilot context, removing them from the prompt assembly.</p><ul><li><strong>A</strong> — Exclusion does not upload files publicly.</li><li><strong>B</strong> — Excluded files are not used as context at all, not merely encrypted.</li><li><strong>D</strong> — Exclusion does not compile files.</li></ul>"}, {"id": 103, "objective": "Domain 3: Understand Copilot data and architecture", "type": "mc", "stem": "What does it mean that Copilot suggestions are 'generated, not retrieved'?", "confidence": 82, "confidence_label": "Medium", "references": ["https://docs.github.com/en/copilot"], "options": {"A": "The suggestions are looked up in a Stack Overflow mirror", "B": "The model synthesizes new text token-by-token rather than copying a stored answer", "C": "The suggestions are pulled from your git stash", "D": "The suggestions are fetched from a CDN cache"}, "answer": "B", "explanation": "<p><strong>Correct answer: B</strong></p><p>Generative models synthesize output token-by-token; they do not retrieve a pre-stored answer.</p><ul><li><strong>A</strong> — They are not looked up from a Q&A mirror.</li><li><strong>C</strong> — They do not come from your git stash.</li><li><strong>D</strong> — They are not fetched from a CDN cache of answers.</li></ul>"}, {"id": 104, "objective": "Domain 3: Understand Copilot data and architecture", "type": "mc", "stem": "Why can the model's training cutoff matter when relying on Copilot for library APIs?", "confidence": 83, "confidence_label": "Medium", "references": ["https://docs.github.com/en/copilot", "https://docs.github.com/en/copilot/responsible-use-of-github-copilot-features"], "options": {"A": "The cutoff controls editor themes", "B": "Newer APIs released after the cutoff may be unknown or outdated in the model's knowledge", "C": "The cutoff determines your subscription price", "D": "The cutoff increases the context window automatically"}, "answer": "B", "explanation": "<p><strong>Correct answer: B</strong></p><p>A model trained up to a certain date may lack knowledge of newer APIs, so verification is needed.</p><ul><li><strong>A</strong> — It is unrelated to editor themes.</li><li><strong>C</strong> — It does not affect pricing.</li><li><strong>D</strong> — The cutoff does not change the context window.</li></ul>"}, {"id": 105, "objective": "Domain 3: Understand Copilot data and architecture", "type": "mc", "stem": "Which best describes how Copilot prioritizes context when assembling a prompt?", "confidence": 82, "confidence_label": "Medium", "references": ["https://docs.github.com/ ng more precise suggestions.</p><ul><li><strong>A</strong> — 'do the thing' provides no actionable detail.</li><li><strong>C</strong> — 'write code' is too vague to guide the model.</li><li><strong>D</strong> — 'make it work please' lacks any concrete requirements.</li></ul>"}, {"id": 116, "objective": "Domain 4: Apply prompt engineering and context crafting", "type": "mc", "stem": "What is 'context crafting' when working with GitHub Copilot?", "confidence": 85, "confidence_label": "High", "references": ["https://docs.github.com/en/copilot/using-github-copilot/prompt-engineering-for-github-copilot"], "options": {"A": "Changing the editor color theme to influence the model", "B": "Renaming the project to a shorter name", "C": "Compressing the repository to reduce token usage", "D": "Deliberately shaping the surrounding code, comments, and references so Copilot has the right information"}, "answer": "D", "explanation": "<p><strong>Correct answer: D</strong></p><p>Context crafting means intentionally arranging code, comments, and references to give Copilot the most relevant context.</p><ul><li><strong>A</strong> — Themes do not influence model output.</li><li><strong>B</strong> — Renaming the project does not craft useful context.</li><li><strong>C</strong> — Compressing the repo is not how context is shaped.</li></ul>"}, {"id": 117, "objective": "Domain 4: Apply prompt engineering and context crafting", "type": "mc", "stem": "Why does writing a descriptive function signature and docstring before the body often help Copilot?", "confidence": 87, "confidence_label": "High", "references": ["https://docs.github.com/en/copilot/using-github-copilot/prompt-engineering-for-github-copilot"], "options": {"A": "It communicates the intended behavior so Copilot can implement the body to match", "B": "It forces Copilot to run offline", "C": "It disables suggestions for that function", "D": "It hides the function from the model"}, "answer": "A", "explanation": "<p><strong>Correct answer: A</strong></p><p>A clear signature and docstring express intent, guiding Copilot to generate a matching implementation.</p><ul><li><strong>B</strong> — It does not change online/offline behavior.</li><li><strong>C</strong> — It does not disable suggestions.</li><li><strong>D</strong> — It exposes intent rather than hiding the function.</li></ul>"}, {"id": 118, "objective": "Domain 4: Apply prompt engineering and context crafting", "type": "mc", "stem": "A developer wants Copilot to follow a particular library's conventions. What is an effective technique?", "confidence": 84, "confidence_label": "Medium", "references": ["https://docs.github.com/en/copilot/using-github-copilot/prompt-engineering-for-github-copilot"], "options": {"A": "Provide an example usage of the library nearby so Copilot can mirror its style", "B": "Delete all imports so Copilot guesses freely", "C": "Use a smaller monitor", "D": "Write the prompt in all capital letters"}, "answer": "A", "explanation": "<p><strong>Correct answer: A</strong></p><p>Showing a concrete example of the library in use gives Copilot a pattern to follow.</p><ul><li><strong>B</strong> — Removing imports reduces context and worsens results.</li><li><strong>C</strong> — Monitor size is irrelevant.</li><li><strong>D</strong> — Capitalization does not improve adherence to conventions.</li></ul>"}, {"id": 119, "objective": "Domain 4: Apply prompt engineering and context crafting", "type": "mc", "stem": "Which approach embodies the 'iterate on the prompt' best practice?", "confidence": 86, "confidence_label": "High", "references": ["https://docs.github.com/en/copilot/using-github-copilot/prompt-engineering-for-github-copilot"], "options": {"A": "Refine the comment or instruction and regenerate when the first suggestion is off-target", "B": "Restart the IDE after every keystroke", "C": "Accept the first suggestion regardless of fit", "D": "Switch programming languages until it works"}, "answer": "A", "explanation": "<p><stron jects at once", "C": "Move the relevant code/comments closer to the cursor and reduce unrelated noise", "D": "Increase the editor brightness"}, "answer": "C", "explanation": "<p><strong>Correct answer: C</strong></p><p>Bringing relevant context near the cursor and cutting noise improves the prompt Copilot assembles.</p><ul><li><strong>A</strong> — Unrelated TODOs add noise rather than relevance.</li><li><strong>B</strong> — Opening unrelated projects dilutes the context.</li><li><strong>D</strong> — Brightness has no effect on suggestions.</li></ul>"}, {"id": 128, "objective": "Domain 4: Apply prompt engineering and context crafting", "type": "mc", "stem": "Which is the best example of an effective 'role + task + constraints' prompt to Copilot Chat?", "confidence": 85, "confidence_label": "High", "references": ["https://docs.github.com/en/copilot/using-github-copilot/prompt-engineering-for-github-copilot", "https://docs.github.com/en/copilot/using-github-copilot/copilot-chat"], "options": {"A": "'help'", "B": "'code'", "C": "'As a security reviewer, identify SQL injection risks in this function and suggest parameterized queries.'", "D": "'fix everything'"}, "answer": "C", "explanation": "<p><strong>Correct answer: C</strong></p><p>Specifying a role, a concrete task, and constraints yields focused, actionable responses.</p><ul><li><strong>A</strong> — 'help' is far too vague.</li><li><strong>B</strong> — 'code' provides no task at all.</li><li><strong>D</strong> — 'fix everything' lacks scope and direction.</li></ul>"}, {"id": 129, "objective": "Domain 4: Apply prompt engineering and context crafting", "type": "mc", "stem": "How can you guide Copilot to write tests that match your framework (e.g., pytest)?", "confidence": 84, "confidence_label": "Medium", "references": ["https://docs.github.com/en/copilot/using-github-copilot/prompt-engineering-for-github-copilot"], "options": {"A": "Mention the framework and show an existing test as an example in context", "B": "Hide all existing tests from the model", "C": "Disable the test runner", "D": "Use a different language for the tests"}, "answer": "A", "explanation": "<p><strong>Correct answer: A</strong></p><p>Naming the framework and exposing an example test guides Copilot to produce matching tests.</p><ul><li><strong>B</strong> — Hiding tests removes a useful pattern.</li><li><strong>C</strong> — Disabling the runner does not affect generation.</li><li><strong>D</strong> — Switching languages defeats the purpose.</li></ul>"}, {"id": 130, "objective": "Domain 4: Apply prompt engineering and context crafting", "type": "mc", "stem": "What is the benefit of telling Copilot what NOT to do (negative constraints) in a prompt?", "confidence": 80, "confidence_label": "Medium", "references": ["https://docs.github.com/en/copilot/using-github-copilot/prompt-engineering-for-github-copilot"], "options": {"A": "It steers Copilot away from undesired approaches or dependencies", "B": "It permanently blocks those words from the model", "C": "It increases the token limit", "D": "It changes the model architecture"}, "answer": "A", "explanation": "<p><strong>Correct answer: A</strong></p><p>Negative constraints help exclude undesired solutions, narrowing toward acceptable ones.</p><ul><li><strong>B</strong> — It does not permanently block words globally.</li><li><strong>C</strong> — It does not increase the token limit.</li><li><strong>D</strong> — It does not change the architecture.</li></ul>"}, {"id": 131, "objective": "Domain 4: Apply prompt engineering and context crafting", "type": "mc", "stem": "Which describes an effective feedback loop with Copilot Chat for a complex feature?", "confidence": 84, "confidence_label": "Medium", "references": ["https://docs.github.com/en/copilot/using-github-copilot/prompt-engineering-for-github-copilot", "https://docs.github.com/en/copilot/using-github-copilot/copilot-chat"], "options": {"A": "Send the same prompt repeatedly with no changes", "B": "Never read the response, just paste it", "C": "Ask, review the output, point out what is wrong, and ask for a revision", "D": "Ask once and accept whatever is returned"}, "answer": "C", "explanation": "<p><strong>Correct answer: C</strong></p><p>Conversational refinement—reviewing and correcting—produces better results for complex tasks.</p><ul><li><strong>A</strong> — Repeating the identical prompt yields little improvement.</li><li><strong>B</strong> — Pasting without reading risks errors.</li><li><strong>D</strong> — Accepting blindly skips refinement.</li></ul>"}, {"id": 132, "objective": "Domain 4: Apply prompt engineering and context crafting", "type": "mc", "stem": "Why might including the relevant data model or schema in context improve generated queries?", "confidence": 84, "confidence_label": "Medium", "references": ["https://docs.github.com/en/copilot/using-github-copilot/prompt-engineering-for-github-copilot"], "options": {"A": "It changes the database engine automatically", "B": "It removes the need for a database", "C": "Copilot can reference the actual table/field names and types to produce correct queries", "D": "It disables the query planner"}, "answer": "C", "explanation": "<p><strong>Correct answer: C</strong></p><p>Providing the schema lets Copilot use real names and types, improving query accuracy.</p><ul><li><strong>A</strong> — It does not switch database engines.</li><li><strong>B</strong> — It does not remove the need for a database.</li><li><strong>D</strong> — It does not disable the query planner.</li></ul>"}, {"id": 133, "objective": "Domain 4: Apply prompt engineering and context crafting", "type": "mc", "stem": "What is a good practice when a single prompt tries to do too many things at once?", "confidence": 83, "confidence_label": "Medium", "references": ["https://docs.github.com/en/copilot/using-github-copilot/prompt-engineering-for-github-copilot"], "options": {"A": "Split it into focused prompts, each handling one concern", "B": "Write the prompt as a single very long line", "C": "Remove all punctuation from the prompt", "D": "Combine even more tasks into one giant prompt"}, "answer": "A", "explanation": "<p><strong>Correct answer: A</strong></p><p>Focused, single-concern prompts are clearer and produce better results than overloaded ones.</p><ul><li><strong>B</strong> — A long single line does not improve focus.</li><li><strong>C</strong> — Punctuation removal does not help.</li><li><strong>D</strong> — Adding more tasks worsens clarity.</li></ul>"}, {"id": 134, "objective": "Domain 4: Apply prompt engineering and context crafting", "type": "mc", "stem": "Which is an example of using comments as inline prompts effectively?", "confidence": 85, "confidence_label": "High", "references": ["https://docs.github.com/en/copilot/using-github-copilot/prompt-engineering-for-github-copilot"], "options": {"A": "Writing '# TODO' with no detail", "B": "Writing a comment unrelated to the code", "C": "Writing '# return the median of a list of numbers, handling empty lists' above the function", "D": "Removing all comments before generation"}, "answer": "C", "explanation": "<p><strong>Correct answer: C</strong></p><p>A precise comment describing the exact behavior steers Copilot to implement it correctly.</p><ul><li><strong>A</strong> — A bare '# TODO' gives no actionable guidance.</li><li><strong>B</strong> — Unrelated comments add noise.</li><li><strong>D</strong> — Removing comments eliminates useful guidance.</li></ul>"}, {"id": 135, "objective": "Domain 4: Apply prompt engineering and context crafting", "type": "mc", "stem": "How does specifying expected error handling in a prompt influence Copilot?", "confidence": 82, "confidence_label": "Medium", "references": ["https://docs.github.com/en/copilot/using-github-copilot/prompt-engineering-for-github-copilot"], "options": {"A": "Copilot will refuse the request", "B": "Copilot will only generate comments", "C": "Copilot will switch to a different file", "D": "Copilot is te descriptive signatures and docstrings", "C": "Place related code near the cursor", "D": "Fill the file with unrelated noise", "E": "Use random identifier names"}, "answer": ["A", "B", "C"], "explanation": "<p><strong>Correct answers: A, B, C</strong></p><ul><li><strong>A</strong> (correct) — Open relevant files provide useful context.</li><li><strong>B</strong> (correct) — Descriptive signatures express intent.</li><li><strong>C</strong> (correct) — Nearby related code improves relevance.</li><li><strong>D</strong> (incorrect) — Noise dilutes the context.</li><li><strong>E</strong> (incorrect) — Random names mislead the model.</li></ul>"}, {"id": 138, "objective": "Domain 4: Apply prompt engineering and context crafting", "type": "multi", "stem": "Which details, when added to a prompt, tend to improve a generated function? (Choose three.)", "confidence": 85, "confidence_label": "High", "references": ["https://docs.github.com/en/copilot/using-github-copilot/prompt-engineering-for-github-copilot"], "options": {"A": "Expected input and output types", "B": "Edge cases to handle", "C": "Performance or dependency constraints", "D": "The developer's favorite color", "E": "The current time zone of the office"}, "answer": ["A", "B", "C"], "explanation": "<p><strong>Correct answers: A, B, C</strong></p><ul><li><strong>A</strong> (correct) — Types clarify the contract.</li><li><strong>B</strong> (correct) — Edge cases direct robust handling.</li><li><strong>C</strong> (correct) — Constraints shape acceptable solutions.</li><li><strong>D</strong> (incorrect) — Favorite color is irrelevant.</li><li><strong>E</strong> (incorrect) — Office time zone is irrelevant to the function.</li></ul>"}, {"id": 139, "objective": "Domain 4: Apply prompt engineering and context crafting", "type": "multi", "stem": "Which are good reasons to iterate with Copilot Chat rather than accepting the first answer? (Choose two.)", "confidence": 84, "confidence_label": "Medium", "references": ["https://docs.github.com/en/copilot/using-github-copilot/prompt-engineering-for-github-copilot", "https://docs.github.com/en/copilot/using-github-copilot/copilot-chat"], "options": {"A": "The first answer may miss constraints you can clarify", "B": "Refinement can correct subtle logic errors", "C": "Iteration retrains the model for everyone", "D": "Iteration disables the context window"}, "answer": ["A", "B"], "explanation": "<p><strong>Correct answers: A, B</strong></p><ul><li><strong>A</strong> (correct) — Clarifying constraints improves later answers.</li><li><strong>B</strong> (correct) — Refinement catches and fixes errors.</li><li><strong>C</strong> (incorrect) — Iteration does not retrain the model.</li><li><strong>D</strong> (incorrect) — Iteration does not disable the context window.</li></ul>"}, {"id": 140, "objective": "Domain 4: Apply prompt engineering and context crafting", "type": "hotspot", "stem": "For each prompt, select whether it is Well-scoped or Too vague for Copilot.", "confidence": 85, "confidence_label": "High", "references": ["https://docs.github.com/en/copilot/using-github-copilot/prompt-engineering-for-github-copilot"], "rows": [{"label": "'Write a function to validate an email and return a boolean'", "options": ["Well-scoped", "Too vague"]}, {"label": "'fix it'", "options": ["Well-scoped", "Too vague"]}, {"label": "'Generate pytest unit tests covering empty and negative inputs'", "options": ["Well-scoped", "Too vague"]}], "answer": [{"row": "'Write a function to validate an email and return a boolean'", "correct": "Well-scoped"}, {"row": "'fix it'", "correct": "Too vague"}, {"row": "'Generate pytest unit tests covering empty and negative inputs'", "correct": "Well-scoped"}], "explanation": "<p><strong>Specific, constrained prompts outperform vague ones.</strong></p><ul><li><strong>'Write a function to validate an email and return a boolean': Well-scoped</strong> — It states the task and output clearly.</li><li><strong>'fix it': Too vague</strong> — It provides no detail about what to fix or how.</li><li><strong>'Generate pytest unit tests covering empty and negative inputs': Well-scoped</strong> — It names the framework and the cases to cover.</li></ul>"}, {"id": 141, "objective": "Domain 5: Improve developer productivity", "type": "mc", "stem": "How can GitHub Copilot most directly help with writing unit tests?", "confidence": 87, "confidence_label": "High", "references": ["https://docs.github.com/en/copilot/using-github-copilot/copilot-chat", "https://learn.microsoft.com/en-us/training/courses/gh-300"], "options": {"A": "By replacing the test runner entirely", "B": "By generating test cases (e.g., via /tests) that cover typical and edge scenarios for selected code", "C": "By deleting failing tests automatically", "D": "By deploying the application to production"}, "answer": "B", "explanation": "<p><strong>Correct answer: B</strong></p><p>Copilot can generate unit tests for selected code, including common and edge cases, accelerating test authoring.</p><ul><li><strong>A</strong> — It does not replace the test runner.</li><li><strong>C</strong> — It does not delete failing tests automatically.</li><li><strong>D</strong> — It does not deploy applications.</li></ul>"}, {"id": 142, "objective": "Domain 5: Improve developer productivity", "type": "mc", "stem": "A developer wants Copilot to help refactor a long function. What is a productive workflow?", "confidence": 86, "confidence_label": "High", "references": ["https://docs.github.com/en/copilot/using-github-copilot/copilot-chat"], "options": {"A": "Ask Copilot to refactor and merge without review", "B": "Delete the function and hope Copilot recreates it", "C": "Refactor only the comments and ignore the logic", "D": "Select the function, ask Copilot Chat to refactor it for readability, then review and test the result"}, "answer": "D", "explanation": "<p><strong>Correct answer: D</strong></p><p>Selecting the code, requesting a refactor, then reviewing and testing balances speed with safety.</p><ul><li><strong>A</strong> — Merging without review abandons quality control.</li><li><strong>B</strong> — Deleting and hoping is unreliable and risky.</li><li><strong>C</strong> — Refactoring only comments does not improve the logic.</li></ul>"}, {"id": 143, "objective": "Domain 5: Improve developer productivity", "type": "mc", "stem": "How can Copilot assist with code documentation?", "confidence": 85, "confidence_label": "High", "references": ["https://docs.github.com/en/copilot/using-github-copilot/copilot-chat"], "options": {"A": "By generating docstrings or comments (e.g., via /doc) that you then review for accuracy", "B": "By publishing documentation to a public site automatically", "C": "By preventing anyone from editing comments", "D": "By removing all existing documentation"}, "answer": "A", "explanation": "<p><strong>Correct answer: A</strong></p><p>Copilot can draft docstrings/comments to speed documentation, which you should verify for accuracy.</p><ul><li><strong>B</strong> — It does not auto-publish docs to a site.</li><li><strong>C</strong> — It does not lock comments from editing.</li><li><strong>D</strong> — It does not remove existing documentation.</li></ul>"}, {"id": 144, "objective": "Domain 5: Improve developer productivity", "type": "mc", "stem": "Which is a realistic productivity benefit of Copilot during code review preparation?", "confidence": 84, "confidence_label": "Medium", "references": ["https://docs.github.com/en/copilot/using-github-copilot/copilot-chat"], "options": {"A": "Guaranteeing zero defects in the change", "B": "Approving the pull request on the author's behalf", "C": "Summarizing changes and explaining unfamiliar code so the author can write a clearer PR description", "D": "Eliminating the need for human reviewers"}, "answer": "C", "explanation": "<p><strong>Correct answer: C</strong></p><p>Copilot can summarize diffs and explain code, helping authors prepare clearer PRs, but human review i><strong>B</strong> — Silencing a test hides the problem rather than fixing it.</li><li><strong>C</strong> — Rewriting the whole codebase is excessive and risky.</li><li><strong>D</strong> — Deleting logs removes useful diagnostic information.</li></ul>"}, {"id": 147, "objective": "Domain 5: Improve developer productivity", "type": "mc", "stem": "Which task is well-suited to Copilot for boosting productivity on repetitive code?", "confidence": 84, "confidence_label": "Medium", "references": ["https://docs.github.com/en/copilot/using-github-copilot/getting-code-suggestions-in-your-ide-with-github-copilot"], "options": {"A": "Approving budget for new hardware", "B": "Negotiating vendor contracts", "C": "Generating boilerplate such as data classes, getters/setters, or mapping functions", "D": "Choosing the company's cloud provider"}, "answer": "C", "explanation": "<p><strong>Correct answer: C</strong></p><p>Copilot excels at generating repetitive boilerplate, freeing developers for higher-value work.</p><ul><li><strong>A</strong> — Budget approvals are not coding tasks.</li><li><strong>B</strong> — Contract negotiation is outside Copilot's scope.</li><li><strong>D</strong> — Cloud provider selection is a business decision, not a coding task.</li></ul>"}, {"id": 148, "objective": "Domain 5: Improve developer productivity", "type": "mc", "stem": "How can Copilot support learning a new language while remaining productive?", "confidence": 82, "confidence_label": "Medium", "references": ["https://docs.github.com/en/copilot/using-github-copilot/copilot-chat", "https://learn.microsoft.com/en-us/training/courses/gh-300"], "options": {"A": "By hiding compiler errors", "B": "By suggesting idiomatic examples and explaining syntax, which the developer verifies and learns from", "C": "By translating the entire app to assembly", "D": "By preventing the use of any documentation"}, "answer": "B", "explanation": "<p><strong>Correct answer: B</strong></p><p>Copilot can provide idiomatic examples and explanations that aid learning when verified.</p><ul><li><strong>A</strong> — It does not hide compiler errors.</li><li><strong>C</strong> — It does not translate apps to assembly as a learning aid.</li><li><strong>D</strong> — It does not block documentation use.</li></ul>"}, {"id": 149, "objective": "Domain 5: Improve developer productivity", "type": "mc", "stem": "What is a balanced expectation of Copilot's effect on productivity?", "confidence": 83, "confidence_label": "Medium", "references": ["https://learn.microsoft.com/en-us/training/courses/gh-300", "https://docs.github.com/en/copilot/responsible-use-of-github-copilot-features"], "options": {"A": "It only slows developers down", "B": "It can speed up many tasks, but gains depend on the task and require human review", "C": "It has no measurable effect on any task", "D": "It makes every developer exactly twice as fast guaranteed"}, "answer": "B", "explanation": "<p><strong>Correct answer: B</strong></p><p>Productivity gains are real but variable and still require human oversight.</p><ul><li><strong>A</strong> — It generally helps rather than only slowing developers.</li><li><strong>C</strong> — It clearly affects many tasks.</li><li><strong>D</strong> — No fixed guaranteed multiplier applies to all developers.</li></ul>"}, {"id": 150, "objective": "Domain 5: Improve developer productivity", "type": "mc", "stem": "How can Copilot Chat assist with understanding a legacy module quickly?", "confidence": 84, "confidence_label": "Medium", "references": ["https://docs.github.com/en/copilot/using-github-copilot/copilot-chat"], "options": {"A": "By rewriting the module without telling you", "B": "By converting the module to an image", "C": "By explaining what the code does and how components interact when asked with relevant context", "D": "By deleting the module to simplify things"}, "answer": "C", "explanation": "<p><strong>Correct answer: C</strong></p><p>Asking Copilot to explain legacy code accelerates comprehension before making changes.</p><ul><li><strong>A</strong> — It does not secretly rewrite code.</li><li><strong>B</strong> — It does not convert code to images.</li><li><strong>D</strong> — Deleting the module is not understanding it.</li></ul>"}]}, {"number": 4, "questions": [{"id": 151, "objective": "Domain 5: Improve developer productivity", "type": "mc", "stem": "Which is an appropriate use of Copilot to improve documentation quality over time?", "confidence": 82, "confidence_label": "Medium", "references": ["https://docs.github.com/en/copilot/using-github-copilot/copilot-chat"], "options": {"A": "Auto-merging documentation PRs without review", "B": "Drafting README sections or API docs that maintainers review and refine", "C": "Encrypting the docs so only Copilot can read them", "D": "Removing the documentation to reduce maintenance"}, "answer": "B", "explanation": "<p><strong>Correct answer: B</strong></p><p>Copilot can draft documentation that humans review, improving coverage and quality.</p><ul><li><strong>A</strong> — Auto-merging without review risks inaccuracies.</li><li><strong>C</strong> — Encrypting docs defeats their purpose.</li><li><strong>D</strong> — Removing docs harms maintainability.</li></ul>"}, {"id": 152, "objective": "Domain 5: Improve developer productivity", "type": "mc", "stem": "How can Copilot help with writing commit messages or PR descriptions?", "confidence": 82, "confidence_label": "Medium", "references": ["https://docs.github.com/en/copilot/using-github-copilot/copilot-chat"], "options": {"A": "By drafting a summary of the changes that the developer edits for accuracy", "B": "By force-pushing to main with a generated message", "C": "By preventing commits without AI involvement", "D": "By hiding the diff from the author"}, "answer": "A", "explanation": "<p><strong>Correct answer: A</strong></p><p>Copilot can draft commit/PR text from the changes, which the author reviews and edits.</p><ul><li><strong>B</strong> — It does not force-push automatically.</li><li><strong>C</strong> — It does not block non-AI commits.</li><li><strong>D</strong> — It does not hide diffs.</li></ul>"}, {"id": 153, "objective": "Domain 5: Improve developer productivity", "type": "mc", "stem": "A team wants to increase test coverage efficiently. How does Copilot fit in?", "confidence": 84, "confidence_label": "Medium", "references": ["https://docs.github.com/en/copilot/using-github-copilot/copilot-chat"], "options": {"A": "It deletes code that is hard to test", "B": "It guarantees 100% coverage with no effort", "C": "It can suggest additional test cases for under-tested code, which the team validates", "D": "It disables coverage reporting"}, "answer": "C", "explanation": "<p><strong>Correct answer: C</strong></p><p>Copilot can propose extra test cases to raise coverage, subject to team validation.</p><ul><li><strong>A</strong> — It does not delete hard-to-test code.</li><li><strong>B</strong> — It cannot guarantee 100% coverage automatically.</li><li><strong>D</strong> — It does not disable coverage reporting.</li></ul>"}, {"id": 154, "objective": "Domain 5: Improve developer productivity", "type": "mc", "stem": "Which describes a productive pair-programming-style use of Copilot Chat?", "confidence": 83, "confidence_label": "Medium", "references": ["https://docs.github.com/en/copilot/using-github-copilot/copilot-chat"], "options": {"A": "Letting Copilot make all architectural decisions unchecked", "B": "Ignoring Copilot's suggestions entirely at all times", "C": "Asking Copilot to approve its own code", "D": "Discussing design options and trade-offs, then implementing the chosen approach with review"}, "answer": "D", "explanation": "<p><strong>Correct answer: D</strong></p><p>Using Chat to explore options and trade-offs, then implementing with review, mirrors healthy pair programming.</p><ul><li><strong>A</strong> — Unchecked architectural decisions remove human judgment.</li><li><strong>B</strong> — Ignoring all suggestions wastes the tool's value.</li><li><strong>C</strong> — Copilot cannot meaningfully approve its own output.</li></ul>"}, {"id": 155, "objective": "Domain 5: Improve developer productivity", "type": "mc", "stem": "How can Copilot reduce the time spent on repetitive refactors across similar code?", "confidence": 82, "confidence_label": "Medium", "references": ["https://docs.github.com/en/copilot/using-github-copilot/copilot-chat"], "options": {"A": "By suggesting consistent transformations you can apply and verify in each location", "B": "By permanently locking the files", "C": "By converting the project to a different VCS", "D": "By rewriting unrelated modules at random"}, "answer": "A", "explanation": "<p><strong>Correct answer: A</strong></p><p>Copilot can propose consistent refactoring patterns to apply and verify, saving time.</p><ul><li><strong>B</strong> — It does not lock files.</li><li><strong>C</strong> — It does not change version control systems.</li><li><strong>D</strong> — It does not randomly rewrite unrelated modules.</li></ul>"}, {"id": 156, "objective": "Domain 5: Improve developer productivity", "type": "mc", "stem": "What is a sensible way to use Copilot when fixing a bug reported in an issue?", "confidence": 84, "confidence_label": "Medium", "references": ["https://docs.github.com/en/copilot/using-github-copilot/copilot-chat"], "options": {"A": "Provide the relevant code and error context, ask for likely causes and fixes, then test the fix", "B": "Close the issue without changes because Copilot exists", "C": "Ask Copilot to email the customer an apology", "D": "Apply the first suggestion to production immediately"}, "answer": "A", "explanation": "<p><strong>Correct answer: A</strong></p><p>Giving Copilot the code and error context to suggest causes/fixes, then testing, is an effective debugging workflow.</p><ul><li><strong>B</strong> — Closing the issue without a fix does not resolve it.</li><li><strong>C</strong> — Customer communication is not a Copilot code task.</li><li><strong>D</strong> — Pushing the first suggestion to production untested is risky.</li></ul>"}, {"id": 157, "objective": "Domain 5: Improve developer productivity", "type": "mc", "stem": "How does Copilot assist with code consistency in a large codebase?", "confidence": 80, "confidence_label": "Medium", "references": ["https://docs.github.com/en/copilot/using-github-copilot/prompt-engineering-for-github-copilot", "https://docs.github.com/en/copilot/using-github-copilot/getting-code-suggestions-in-your-ide-with-github-copilot"], "options": {"A": "By enforcing a linter without configuration", "B": "By disabling the formatter", "C": "By suggesting code that matches nearby patterns when relevant context is available", "D": "By rewriting the entire repo to one style instantly"}, "answer": "C", "explanation": "<p><strong>Correct answer: C</strong></p><p>With relevant context, Copilot tends to mirror existing patterns, supporting consistency.</p><ul><li><strong>A</strong> — It is not a linter and does not enforce rules by itself.</li><li><strong>B</strong> — It does not disable formatters.</li><li><strong>D</strong> — It does not instantly restyle the whole repo.</li></ul>"}, {"id": 158, "objective": "Domain 5: Improve developer productivity", "type": "mc", "stem": "Which is a realistic limitation to remember when using Copilot to boost productivity?", "confidence": 85, "confidence_label": "High", "references": ["https://docs.github.com/en/copilot/responsible-use-of-github-copilot-features"], "options": {"A": "Copilot eliminates the need to understand the code", "B": "Copilot removes the need for any quality process", "C": "Time saved generating code can be offset if review and testing are skipped and defects slip through", "D": "Copilot guarantees defect-free output"}, "answer": "C", "explanation": "<p><strong>Correct answer: C</strong></p><p>Productivity gains can erode if review/testing are neglected, so they must remain part of the process.</p><ul><li><strong>A</strong> — Understanding the code remains essential.</li><li><strong>B</strong> — Quality processes are still required.</li><li><strong>D</strong> — Output is not guaranteed defect-free.</li></ul>"}, {"id": 159, "objective": "Domain 5: Improve developer productivity", "type": "mc", "stem": "How can Copilot help onboard a new team member productively?", "confidence": 82, "confidence_label": "Medium", "references": ["https://docs.github.com/en/copilot/using-github-copilot/copilot-chat"], "options": {"A": "By granting repository admin access", "B": "By explaining unfamiliar code and conventions, supplementing documentation and mentorship", "C": "By replacing all onboarding documentation and mentors", "D": "By assigning tasks to the new hire"}, "answer": "B", "explanation": "<p><strong>Correct answer: B</strong></p><p>Copilot can explain code and conventions to support onboarding alongside docs and mentorship.</p><ul><li><strong>A</strong> — It does not manage repository permissions.</li><li><strong>C</strong> — It supplements rather than replaces docs and mentors.</li><li><strong>D</strong> — It does not assign work items.</li></ul>"}, {"id": 160, "objective": "Domain 5: Improve developer productivity", "type": "mc", "stem": "What is an effective way to use Copilot for generating example data or fixtures?", "confidence": 83, "confidence_label": "Medium", "references": ["https://docs.github.com/en/copilot/using-github-copilot/prompt-engineering-for-github-copilot"], "options": {"A": "Ask it to create representative sample data matching your schema, then verify validity", "B": "Use it to delete the production database", "C": "Use it to bypass data privacy rules", "D": "Use it to generate real customer PII for tests"}, "answer": "A", "explanation": "<p><strong>Correct answer: A</strong></p><p>Copilot can generate synthetic, schema-matching sample data for tests, which you validate.</p><ul><li><strong>B</strong> — It does not and shoul clusions, and safeguards", "type": "mc", "stem": "Which statement about disabling public code matching is accurate?", "confidence": 82, "confidence_label": "Medium", "references": ["https://docs.github.com/en/copilot/managing-copilot/managing-github-copilot-in-your-organization/setting-policies-for-copilot-in-your-organization/managing-policies-for-copilot-in-your-organization", "https://docs.github.com/en/copilot/responsible-use-of-github-copilot-features"], "options": {"A": "It is only available on the Free plan", "B": "It deletes all public repositories", "C": "It disables Copilot entirely", "D": "It is a policy that, when enabled, blocks suggestions matching public code to reduce duplication/licensing risk"}, "answer": "D", "explanation": "<p><strong>Correct answer: D</strong></p><p>The public-code-matching policy blocks matching suggestions, mitigating duplication and licensing concerns.</p><ul><li><strong>A</strong> — It is an organization policy, not a Free-only feature.</li><li><strong>B</strong> — It does not delete public repositories.</li><li><strong>C</strong> — It does not disable Copilot entirely.</li></ul>"}, {"id": 194, "objective": "Domain 6: Configure privacy, content exclusions, and safeguards", "type": "mc", "stem": "A team wants to ensure generated code does not include a specific internal proprietary module as context. What is the right control?", "confidence": 84, "confidence_label": "Medium", "references": ["https://docs.github.com/en/copilot/managing-copilot/configuring-and-auditing-content-exclusion"], "options": {"A": "Comment out the module", "B": "Obfuscate the module's variable names", "C": "Move the module to a subfolder", "D": "Add the proprietary module's path to content exclusions"}, "answer": "D", "explanation": "<p><strong>Correct answer: D</strong></p><p>Content exclusion on the module's path prevents it from being used as Copilot context.</p><ul><li><strong>A</strong> — Commenting it out changes the code, not the exclusion.</li>  to train the foundational model by default: False</strong> — They are excluded from training by default.</li><li><strong>Organizations can block suggestions that match public code: True</strong> — The duplication-detection policy can block public-code matches.</li></ul>"}]}]};

// ----- state -----
let testIdx = 0;
let cur = 0;
const answers = {};  // key `${testIdx}:${qid}` -> answer (letter | array | {row:val})
const flags = new Set(); // `${testIdx}:${qid}`
const checked = new Set();
let timeLeft = 6000;
let timerId = null;

const $ = (id) => document.getElementById(id);
function curTest(){ return DATA.tests[testIdx]; }
function curQs(){ return curTest().questions; }
function key(qid){ return testIdx + ":" + qid; }

// ----- timer -----
function fmt(t){ const m=Math.floor(t/60), s=t%60; return String(m).padStart(2,"0")+":"+String(s).padStart(2,"0"); }
function startTimer(){
  if(timerId) clearInterval(timerId);
  timerId = setInterval(()=>{
    timeLeft = Math.max(0, timeLeft-1);
    const el=$("timer"); el.textContent=fmt(timeLeft);
    if(timeLeft<=300) el.classList.add("warn");
    if(timeLeft===0){ clearInterval(timerId); openModal(); }
  },1000);
}

// ----- test selector -----
function buildTestSel(){
  const sel=$("testSel"); sel.innerHTML="";
  DATA.tests.forEach((t,i)=>{
    const o=document.createElement("option");
    o.value=i; o.textContent="Test "+t.number+" (Q"+t.questions[0].id+"–"+t.questions[t.questions.length-1].id+")";
    sel.appendChild(o);
  });
  sel.value=testIdx;
  sel.onchange=()=>{ testIdx=+sel.value; cur=0; renderAll(); };
}

// ----- render questions -----
function optionLetters(q){ return Object.keys(q.options); }

function renderPanel(){
  const panel=$("panel"); panel.innerHTML="";
  curQs().forEach((q,i)=>{
    const card=document.createElement("div");
    card.className="card"+(i===cur?" active":"");
    card.dataset.qid=q.id;
    const flagged=flags.has(key(q.id));
    let html="";
    html+='<div class="qmeta">';
    html+='<span class="badge">'+q.objective+'</span>';
    html+='<span class="badge type">'+q.type+'</span>';
    html+='<button class="flagbtn'+(flagged?" on":"")+'" data-flag="'+q.id+'">'+(flagged?"★ Flagged":"⚑ Flag for review")+'</button>';
    html+='<span class="chip '+q.confidence_label+'">Confidence: '+q.confidence+'% · '+q.confidence_label+'</span>';
    html+='</div>';
    html+='<div class="stem">'+(q.id)+'. '+q.stem+'</div>';

    if(q.type==="hotspot"){
      html+='<div class="hint">Select the correct value for each row.</div>';
      q.rows.forEach((r,ri)=>{
        html+='<div class="hotrow" data-row="'+r.label+'"><label>'+r.label+'</label><select data-hrow="'+r.label+'">';
        html+='<option value="">— choose —</option>';
        r.options.forEach(op=>{ html+='<option value="'+op+'">'+op+'</option>'; });
        html+='</select></div>';
      });
    } else {
      if(q.type==="multi") html+='<div class="hint">Select all that apply.</div>';
      optionLetters(q).forEach(l=>{
        html+='<div class="opt'+(q.type==="multi"?" multi":"")+'" data-opt="'+l+'">';
        html+='<span class="mark">'+l+'</span><span><span class="ltr">'+l+'.</span> '+q.options[l]+'</span></div>';
      });
    }

    html+='<div class="actions">';
    html+='<button class="btn ghost" data-nav="prev">‹ Prev</button>';
    html+='<button class="btn primary" data-check="'+q.id+'">Check answer</button>';
    html+='<button class="btn ghost" data-nav="next">Next ›</button>';
    html+='<span class="jump">Question <input type="number" min="1" max="'+curQs().length+'" data-jump value="'+(q.id - curTest().questions[0].id + 1)+'"> of '+curQs().length+'</span>';
    html+='</div>';
    html+='<div class="feedback" data-fb="'+q.id+'"></div>';
    card.innerHTML=html;
    panel.appendChild(card);
  });
  bindCard();
  restoreState();
}

function bindCard(){
  $("panel").querySelectorAll(".opt").forEach(el=>{
    el.onclick=()=>{
      const card=el.closest(".card"); const qid=+card.dataset.qid;
      const q=curQs().find(x=>x.id===qid); const l=el.dataset.opt;
      if(q.type==="multi"){
        let arr=answers[key(qid)]||[]; arr=Array.isArray(arr)?arr.slice():[];
        if(arr.includes(l)) arr=arr.filter(x=>x!==l); else arr.push(l);
        arr.sort(); answers[key(qid)]=arr;
      } else {
        answers[key(qid)]=l;
      }
      restoreState(); paintPalette();
    };
  });
  $("panel").querySelectorAll("select[data-hrow]").forEach(sel=>{
    sel.onchange=()=>{
      const card=sel.closest(".card"); const qid=+card.dataset.qid;
      const obj=answers[key(qid)]||{}; obj[sel.dataset.hrow]=sel.value;
      answers[key(qid)]=obj; paintPalette();
    };
  });
  $("panel").querySelectorAll("[data-flag]").forEach(b=>{
    b.onclick=()=>{ const k=key(+b.dataset.flag);
      if(flags.has(k)) flags.delete(k); else flags.add(k);
      renderPanel(); paintPalette(); };
  });
  $("panel").querySelectorAll("[data-nav]").forEach(b=>{
    b.onclick=()=>{ b.dataset.nav==="prev"?go(cur-1):go(cur+1); };
  });
  $("panel").querySelectorAll("[data-check]").forEach(b=>{
    b.onclick=()=>checkAnswer(+b.dataset.check);
  });
  $("panel").querySelectorAll("[data-jump]").forEach(inp=>{
    inp.onchange=()=>{ let v=parseInt(inp.value,10); if(isNaN(v)) return;
      v=Math.min(Math.max(v,1),curQs().length); go(v-1); };
  });
}

function restoreState(){
  const card=$("panel").querySelector(".card.active"); if(!card) return;
  const qid=+card.dataset.qid; const a=answers[key(qid)];
  card.querySelectorAll(".opt").forEach(el=>{
    el.classList.remove("sel");
    const l=el.dataset.opt;
    if(Array.isArray(a)&&a.includes(l)) el.classList.add("sel");
    else if(!Array.isArray(a)&&a===l) el.classList.add("sel");
  });
  if(a && typeof a==="object" && !Array.isArray(a)){
    card.querySelectorAll("select[data-hrow]").forEach(s=>{ if(a[s.dataset.hrow]) s.value=a[s.dataset.hrow]; });
  }
  if(checked.has(key(qid))) renderFeedback(qid);
}

function go(i){
  if(i<0||i>=curQs().length) return;
  cur=i;
  $("panel").querySelectorAll(".card").forEach((c,idx)=>c.classList.toggle("active",idx===cur));
  updateBar(); paintPalette(); restoreState();
  const prevB=$("panel").querySelector(".card.active [data-nav='prev']");
  const nextB=$("panel").querySelector(".card.active [data-nav='next']");
  if(prevB) prevB.disabled = cur===0;
  if(nextB) nextB.disabled = cur===curQs().length-1;
}

function updateBar(){
  const q=curQs()[cur];
  $("qpos").textContent="Question "+(cur+1)+" of "+curQs().length;
}

// ----- palette -----
function buildPalette(){
  const g=$("pgrid"); g.innerHTML="";
  curQs().forEach((q,i)=>{
    const b=document.createElement("button");
    b.textContent=i+1; b.dataset.i=i;
    b.onclick=()=>go(i);
    g.appendChild(b);
  });
  paintPalette();
}
function paintPalette(){
  $("pgrid").querySelectorAll("button").forEach(b=>{
    const i=+b.dataset.i; const q=curQs()[i]; const k=key(q.id);
    b.className="";
    const a=answers[k];
    const answered = a!==undefined && !(Array.isArray(a)&&a.length===0)
      && !(typeof a==="object"&&!Array.isArray(a)&&Object.values(a).filter(Boolean).length===0);
    if(answered) b.classList.add("answered");
    if(flags.has(k)) b.classList.add("flagged");
    if(i===cur) b.classList.add("current");
  });
}

// ----- check answer -----
function isCorrect(q,a){
  if(q.type==="mc") return a===q.answer;
  if(q.type==="multi"){ if(!Array.isArray(a)) return false;
    return a.length===q.answer.length && q.answer.every(x=>a.includes(x)); }
  if(q.type==="hotspot"){ if(!a||typeof a!=="object") return false;
    return q.answer.every(r=>a[r.row]===r.correct); }
  return false;
}
function checkAnswer(qid){
  checked.add(key(qid)); renderFeedback(qid);
}
function renderFeedback(qid){
  const q=curQs().find(x=>x.id===qid);
  const card=$("panel").querySelector('.card[data-qid="'+qid+'"]');
  const a=answers[key(qid)];
  const ok=isCorrect(q,a);
  // mark options
  if(q.type!=="hotspot"){
    card.querySelectorAll(".opt").forEach(el=>{
      el.classList.remove("correct","wrong");
      const l=el.dataset.opt;
      const isAns = q.type==="mc" ? q.answer===l : q.answer.includes(l);
      const picked = Array.isArray(a)? a.includes(l) : a===l;
      if(isAns) el.classList.add("correct");
      else if(picked) el.classList.add("wrong");
    });
  } else {
    card.querySelectorAll(".hotrow").forEach(row=>{
      const lab=row.dataset.row; const want=q.answer.find(r=>r.row===lab).correct;
      const got=(a||{})[lab];
      row.classList.remove("correct","wrong");
      row.classList.add(got===want?"correct":"wrong");
    });
  }
  const fb=card.querySelector('[data-fb="'+qid+'"]');
  fb.className="feedback show "+(ok?"ok":"no");
  let refs=(q.references||[]).map(r=>'<a href="'+r+'" target="_blank" rel="noopener">'+r+'</a>').join("");
  fb.innerHTML='<h4>'+(ok?"✓ Correct":"✗ Incorrect")+'</h4>'+q.explanation+
    (refs?'<div class="refs"><strong>References</strong>'+refs+'</div>':'');
  paintPalette();
}

// ----- modal / results -----
function openModal(){
  const qs=curQs(); let correct=0;
  const dom={};
  qs.forEach(q=>{
    const a=answers[key(q.id)]; const ok=isCorrect(q,a);
    if(ok) correct++;
    const d=q.objective;
    dom[d]=dom[d]||{c:0,t:0}; dom[d].t++; if(ok) dom[d].c++;
  });
  const pct=Math.round(correct/qs.length*100);
  $("scoreLine").innerHTML=correct+" / "+qs.length+" correct <small>("+pct+"%)</small>";
  const tb=$("brkBody"); tb.innerHTML="";
  Object.keys(dom).sort().forEach(d=>{
    const o=dom[d]; const tr=document.createElement("tr");
    tr.innerHTML="<td>"+d+"</td><td>"+o.c+"</td><td>"+o.t+"</td><td>"+Math.round(o.c/o.t*100)+"%</td>";
    tb.appendChild(tr);
  });
  const wl=$("wrongList"); wl.innerHTML="";
  qs.forEach((q,i)=>{ const a=answers[key(q.id)];
    if(!isCorrect(q,a)){ const b=document.createElement("button");
      b.className="wrongq"; b.textContent="Q"+(i+1);
      b.onclick=()=>{ closeModal(); go(i); checkAnswer(q.id); }; wl.appendChild(b);} });
  if(!wl.children.length) wl.innerHTML='<span style="color:var(--muted);font-size:.82rem;">None — great job!</span>';
  const fl=$("flagList"); fl.innerHTML="";
  qs.forEach((q,i)=>{ if(flags.has(key(q.id))){ const b=document.createElement("button");
    b.className="flag"; b.textContent="Q"+(i+1); b.onclick=()=>{ closeModal(); go(i); }; fl.appendChild(b);} });
  if(!fl.children.length) fl.innerHTML='<span style="color:var(--muted);font-size:.82rem;">No flagged questions.</span>';
  $("modal").classList.add("show");
}
function closeModal(){ $("modal").classList.remove("show"); }

// ----- keyboard -----
document.addEventListener("keydown",(e)=>{
  if(e.target && typeof e.target.matches==="function" && e.target.matches("input,select,textarea")) return;
  if(e.key==="ArrowRight") go(cur+1);
  else if(e.key==="ArrowLeft") go(cur-1);
});

// ----- init -----
function renderAll(){
  $("examTitle").textContent=DATA.title;
  buildTestSel(); renderPanel(); buildPalette(); go(cur); updateBar();
}
$("endBtn").onclick=openModal;
$("closeModal").onclick=closeModal;
$("modal").onclick=(e)=>{ if(e.target===$("modal")) closeModal(); };
$("ptoggle").onclick=()=>{ $("pbody").classList.toggle("collapsed"); };
renderAll();
startTimer();
</script>
